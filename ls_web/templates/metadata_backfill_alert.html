<div id="ls-global-backfill-alert" data-active-section="@@LS0@@" role="alert" aria-live="assertive"
         style="display:none;position:fixed;right:18px;top:78px;width:min(430px,calc(100vw - 36px));box-sizing:border-box;
                z-index:30000;background:#fff1f0;color:#7a1712;border:2px solid #d93025;border-radius:12px;
                box-shadow:0 12px 34px rgba(0,0,0,.32);padding:14px 15px;font:14px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;">
        <button id="ls-global-backfill-alert-close" type="button" aria-label="Close"
                style="float:right;border:0;background:transparent;color:#7a1712;font-size:22px;line-height:18px;cursor:pointer;padding:0 0 6px 12px;">×</button>
        <div style="font-weight:800;font-size:16px;margin:0 28px 5px 0;">Metadata process stopped</div>
        <div id="ls-global-backfill-alert-message"></div>
        <div id="ls-global-backfill-alert-progress" style="margin-top:7px;font-size:12px;color:#92251f;"></div>
        <a href="/downloader"
           style="display:inline-block;margin-top:11px;padding:7px 12px;border-radius:8px;background:#b3261e;color:white;text-decoration:none;font-weight:700;">
            Open Downloader
        </a>
    </div>
