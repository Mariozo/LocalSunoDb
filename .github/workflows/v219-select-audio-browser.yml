name: v2.19 Select Audio browser test

on:
  pull_request:
    branches: [main]

jobs:
  browser-select-audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Seed isolated Local Suno browser fixture
        run: python tests/browser/seed_select_audio_fixture.py
      - name: Start Local Suno
        run: |
          python LocalSunoDb.py --ls-restarted > browser-server.log 2>&1 &
          echo $! > browser-server.pid
          python - <<'PY'
          import time
          from urllib.request import urlopen
          for _ in range(120):
              try:
                  with urlopen("http://127.0.0.1:8765/app-version", timeout=1) as response:
                      if response.status == 200:
                          raise SystemExit(0)
              except Exception:
                  time.sleep(0.25)
          raise SystemExit("Local Suno did not start")
          PY
      - name: Run Select Audio browser flow
        run: python tests/browser/test_select_audio_flow.py
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v219-browser-select-audio-diagnostics
          path: |
            browser-artifacts/
            browser-server.log
          if-no-files-found: warn
          retention-days: 2
      - name: Stop Local Suno
        if: always()
        run: |
          if [ -f browser-server.pid ]; then kill "$(cat browser-server.pid)" || true; fi
