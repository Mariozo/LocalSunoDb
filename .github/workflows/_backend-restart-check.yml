name: Backend restart branch check

on:
  push:
    branches:
      - task/backend-restart-without-windows

permissions:
  contents: read

jobs:
  backend-restart:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_backend_restart.py
      - run: python LocalSunoDb.py --ls-update-probe
