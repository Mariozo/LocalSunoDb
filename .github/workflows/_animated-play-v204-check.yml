name: Animated play v2.04 check

on:
  push:
    branches:
      - task/animated-play-button-v2.04

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -c "from ls_core.runtime import APP_VERSION, APP_BASED_ON; assert APP_VERSION == 'v2.04'; assert APP_BASED_ON == 'v2.03'"
      - name: Check animated cover indicator CSS
        shell: pwsh
        run: |
          $css = Get-Content -Raw "ls_library/static/suno_page_suno_library_list_style_assets.css"
          if (-not $css.Contains("ls-cover-playing-bars")) { throw "missing keyframes" }
          if (-not $css.Contains("animation: ls-cover-playing-bars")) { throw "missing animation binding" }
      - run: python LocalSunoDb.py --ls-update-probe
