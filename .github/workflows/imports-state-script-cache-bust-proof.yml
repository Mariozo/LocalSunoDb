name: Imports state script cache bust proof

on:
  push:
    branches:
      - fix/imports-state-script-cache-bust
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Focused tests
        run: |
          python -m pip install pytest
          python -m py_compile ls_downloader/render.py
          python -m pytest -q tests/test_imports_state_script_cache_bust.py
          git diff --check
      - name: Verify exact runtime delta
        run: |
          python - <<'PY'
          import subprocess
          runtime = {
              name for name in subprocess.check_output(
                  ["git", "diff", "--name-only", "ab368baff25483a20f0e72bf0aa0c3b181cc7521...HEAD"],
                  text=True,
              ).splitlines()
              if name and not name.startswith(("tests/", ".github/"))
          }
          expected = {"ls_downloader/render.py"}
          assert runtime == expected, (runtime, expected)
          PY
      - name: Build exact delta ZIP
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path
          files = ["ls_downloader/render.py"]
          out = Path("LocalSunoDb_IMPORTS_STATE_CACHE_BUST_FIX.zip")
          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for name in files:
                  archive.write(name, name)
          with zipfile.ZipFile(out, "r") as archive:
              assert archive.namelist() == files
              assert archive.testzip() is None
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: LocalSunoDb-IMPORTS-STATE-CACHE-BUST-FIX
          path: LocalSunoDb_IMPORTS_STATE_CACHE_BUST_FIX.zip
          if-no-files-found: error
          retention-days: 7

  windows-exact-artifact:
    needs: focused-proof
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ab368baff25483a20f0e72bf0aa0c3b181cc7521
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: LocalSunoDb-IMPORTS-STATE-CACHE-BUST-FIX
          path: artifact
      - name: Overlay exact ZIP
        shell: pwsh
        run: |
          Expand-Archive -Path ".\artifact\LocalSunoDb_IMPORTS_STATE_CACHE_BUST_FIX.zip" -DestinationPath "." -Force
          python -m py_compile ls_downloader\render.py
      - name: Start and verify cache-busted Downloader asset
        shell: pwsh
        run: |
          @'
          import subprocess
          import sys
          import time
          from urllib.request import urlopen

          out = open("imports-cache-bust.log", "w", encoding="utf-8")
          err = open("imports-cache-bust.err", "w", encoding="utf-8")
          process = subprocess.Popen(
              [sys.executable, "LocalSunoDb.py", "--ls-restarted"],
              stdout=out,
              stderr=err,
          )
          try:
              for _ in range(160):
                  try:
                      with urlopen("http://127.0.0.1:8765/app-version", timeout=1) as response:
                          if response.status == 200:
                              break
                  except Exception:
                      time.sleep(0.25)
              else:
                  raise AssertionError("LS server did not start")

              with urlopen("http://127.0.0.1:8765/downloader", timeout=5) as response:
                  page = response.read().decode("utf-8", errors="replace")

              expected = (
                  "/ls-static/ls_downloader/static/downloader_state_script.js"
                  "?v=v2.28.5&rev=imports-state-cache-bust-1"
              )
              assert expected in page, expected
              assert '<span class="ls-sidebar-title-full">LS v2.28.5</span>' in page
          finally:
              process.terminate()
              try:
                  process.wait(timeout=10)
              except subprocess.TimeoutExpired:
                  process.kill()
                  process.wait(timeout=5)
              out.close()
              err.close()
          '@ | python -
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: imports-state-cache-bust-diagnostics
          path: |
            imports-cache-bust.log
            imports-cache-bust.err
          if-no-files-found: warn
          retention-days: 3
