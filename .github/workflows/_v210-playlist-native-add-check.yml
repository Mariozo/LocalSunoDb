name: Playlist native add v2.10 check

on:
  push:
    branches:
      - task/playlist-native-add-v2.10

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -c "from ls_core.runtime import APP_VERSION, APP_BASED_ON; assert APP_VERSION == 'v2.10'; assert APP_BASED_ON == 'v2.09'"
      - run: python -m pytest -q tests/test_local_playlists.py tests/test_saved_views_runtime.py tests/test_local_suno_runtime.py tests/test_local_suno_migration.py tests/test_backend_restart.py
      - name: Check native Playlist menu link
        shell: pwsh
        run: |
          $render = Get-Content -Raw "ls_library/render.py"
          if (-not $render.Contains('href="/playlists?add_track={urllib.parse.quote(track_id)}"')) { throw "missing native Add to Playlist link" }
          $handler = Get-Content -Raw "ls_web/handler.py"
          if (-not $handler.Contains('add_track_id = params.get("add_track", [""])[0]')) { throw "missing playlist add_track route" }
          $controller = Get-Content -Raw "ls_library/controller.py"
          if (-not $controller.Contains('if path == "/playlist-add-track-open":')) { throw "missing native playlist add endpoint" }
      - run: python LocalSunoDb.py --ls-update-probe
