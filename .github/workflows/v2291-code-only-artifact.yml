name: v2.29.1 code-only artifact

on:
  push:
    branches:
      - integration/v2291-reconstructed

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build exact code-only ZIP
        run: |
          python - <<'PY'
          import subprocess, zipfile
          from pathlib import Path

          include_roots = (
              "LS_Elza/",
              "LS_Suno_TokenBridge/",
              "ls_audio/",
              "ls_core/",
              "ls_data/",
              "ls_downloader/",
              "ls_library/",
              "ls_media/",
              "ls_player/",
              "ls_stems/",
              "ls_suno/",
              "ls_tools/",
              "ls_upgrade/",
              "ls_web/",
          )
          include_files = {
              "LocalSunoDb.py",
              "Start_LocalSunoDb.cmd",
              "RESTART_BACKEND.cmd",
              "INSTALL_v1.16_backend.cmd",
          }
          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          names = [
              name for name in tracked
              if name in include_files or name.startswith(include_roots)
          ]

          forbidden = ("Data/", "Logs/", "Backup/", "Temp/", "Reports/", "exports/")
          assert not any(name.startswith(forbidden) for name in names)
          assert "LocalSunoDb.py" in names
          assert "Start_LocalSunoDb.cmd" in names
          assert any(name.startswith("LS_Elza/") for name in names)
          assert any(name.startswith("ls_web/") for name in names)

          out = Path("LocalSunoDb_v2291_RECONSTRUCTED_CODE_ONLY.zip")
          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for name in names:
                  archive.write(name, name)

          with zipfile.ZipFile(out, "r") as archive:
              assert archive.testzip() is None
              assert "Data/local_suno.db" not in archive.namelist()
          print(f"Packaged {len(names)} code files")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: LocalSunoDb-v2291-RECONSTRUCTED-CODE-ONLY
          path: LocalSunoDb_v2291_RECONSTRUCTED_CODE_ONLY.zip
          if-no-files-found: error
          retention-days: 7

  windows-artifact-smoke:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: LocalSunoDb-v2291-RECONSTRUCTED-CODE-ONLY
          path: artifact
      - name: Test exact ZIP
        shell: pwsh
        run: |
          Expand-Archive -Path ".\artifact\LocalSunoDb_v2291_RECONSTRUCTED_CODE_ONLY.zip" -DestinationPath ".\app" -Force
          Set-Location ".\app"
          python .\LocalSunoDb.py --ls-update-probe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $entry = Get-Content ".\LocalSunoDb.py" -Raw
          if ($entry -notmatch 'APP_VERSION = "v2\.29\.1"') { throw "v2.29.1 identity missing" }

          $stdout = Join-Path $PWD "runtime.stdout.log"
          $stderr = Join-Path $PWD "runtime.stderr.log"
          $p = Start-Process -FilePath "python" -ArgumentList ".\LocalSunoDb.py" -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $ok = $false
          for ($i = 0; $i -lt 50; $i++) {
            Start-Sleep -Milliseconds 400
            if ($p.HasExited) { break }
            try {
              $root = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:8765/" -TimeoutSec 2
              if ($root.StatusCode -eq 200) { $ok = $true; break }
            } catch {}
          }
          if (-not $ok) {
            Write-Host "--- STDOUT ---"
            if (Test-Path $stdout) { Get-Content $stdout }
            Write-Host "--- STDERR ---"
            if (Test-Path $stderr) { Get-Content $stderr }
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
            throw "Exact artifact did not start on port 8765"
          }
          $root = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:8765/" -TimeoutSec 5
          if ($root.Content -notmatch "v2\.29\.1") { throw "Visible v2.29.1 identity missing" }
          $my = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:8765/my-library" -TimeoutSec 5
          if ($my.StatusCode -ne 200) { throw "My Library HTTP check failed" }
          Stop-Process -Id $p.Id -Force
