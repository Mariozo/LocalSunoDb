name: Shared shell stage 1 preview

on:
  push:
    branches:
      - refactor/ls-shell-my-library-selection

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify syntax
        shell: bash
        run: |
          python -m py_compile ls_library/music_browser.py ls_web/handler.py
          node --check ls_web/static/persistent_shell.js
          node --check ls_library/static/my_library_shared_view.js
      - name: Run focused tests
        shell: bash
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_shared_my_library_shell.py

  artifact:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build exact preview overlay
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path
          names = [
              "ls_library/music_browser.py",
              "ls_web/handler.py",
              "ls_web/static/persistent_shell.js",
              "ls_library/static/my_library_shared_view.css",
              "ls_library/static/my_library_shared_view.js",
          ]
          out = Path("LocalSunoDb_shared_shell_stage1_preview.zip")
          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as archive:
              for name in names:
                  archive.write(name, name)
          with zipfile.ZipFile(out, "r") as archive:
              assert archive.namelist() == names
              assert archive.testzip() is None
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: LocalSunoDb-shared-shell-stage1-preview
          path: LocalSunoDb_shared_shell_stage1_preview.zip
          if-no-files-found: error
          retention-days: 7
