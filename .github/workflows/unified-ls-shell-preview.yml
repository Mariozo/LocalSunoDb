name: Unified LS shell preview

on:
  push:
    branches:
      - refactor/unified-ls-shell

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify unified shell scope
        run: |
          python -m py_compile ls_data/music_library.py ls_library/music_browser.py ls_library/playlists.py ls_web/handler.py ls_web/pages.py
          node --check ls_web/static/persistent_shell.js
          node --check ls_player/static/suno_global_player_script_assets.js
          python -m pip install pytest
          python -m pytest -q tests/test_unified_ls_shell.py tests/test_local_playlists.py
      - name: Build exact runtime preview
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path
          names = [
              "ls_data/music_library.py",
              "ls_library/music_browser.py",
              "ls_library/playlists.py",
              "ls_library/static/suno_page_selected_track_shell_style_assets.css",
              "ls_library/templates/library.html",
              "ls_player/static/suno_global_player_script_assets.js",
              "ls_web/handler.py",
              "ls_web/pages.py",
              "ls_web/static/persistent_shell.css",
              "ls_web/static/persistent_shell.js",
          ]
          out = Path("LocalSunoDb_unified_ls_shell_preview.zip")
          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as archive:
              for name in names:
                  archive.write(name, name)
          with zipfile.ZipFile(out, "r") as archive:
              assert archive.namelist() == names
              assert archive.testzip() is None
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: LocalSunoDb-unified-ls-shell-preview
          path: LocalSunoDb_unified_ls_shell_preview.zip
          if-no-files-found: error
          retention-days: 7
