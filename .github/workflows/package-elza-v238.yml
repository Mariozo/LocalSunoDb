name: Package Elza v2.45

on:
  push:
    branches:
      - fix/elza-v238-selection-guard

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install pytest
      - name: Verify Elza v2.45 selection stack
        run: |
          python -m py_compile LS_Elza/selection_intent.py
          python -m py_compile LS_Elza/selection_guard.py
          python -m py_compile LS_Elza/locf_intent.py
          python -m py_compile LS_Elza/ls_adapter/runtime_bridge.py
          python -m py_compile LS_Elza/v230_ui_enhancer.py
          python -m py_compile LS_Elza/ui.py
          python -m py_compile LS_Elza/service.py
          python -m py_compile ls_web/elza_selection_bridge.py
          python -m py_compile ls_web/elza_adapter.py
          python -m py_compile ls_web/elza_controller.py
          python -m py_compile ls_web/elza_selftest.py
          python -m pytest -q tests/test_elza_selection_regression.py
          python - <<'PY'
          from pathlib import Path
          files = (
              "LS_Elza/selection_intent.py",
              "LS_Elza/selection_guard.py",
              "LS_Elza/locf_intent.py",
              "LS_Elza/ls_adapter/runtime_bridge.py",
              "LS_Elza/__init__.py",
              "LS_Elza/v230_ui_enhancer.py",
              "LS_Elza/ui.py",
              "LS_Elza/service.py",
              "ls_web/elza_selection_bridge.py",
              "ls_web/elza_adapter.py",
              "ls_web/elza_controller.py",
              "ls_web/elza_selftest.py",
          )
          for name in files:
              data = Path(name).read_bytes()
              assert b"\r\n" not in data, name
              data.decode("utf-8")
          assert 'LS_ELZA_PACKAGE_VERSION = "2.45"' in Path("LS_Elza/__init__.py").read_text(encoding="utf-8")
          assert "Elza v2.45" in Path("LS_Elza/v230_ui_enhancer.py").read_text(encoding="utf-8")
          PY
      - name: Build overlay ZIP
        run: |
          python - <<'PY'
          from zipfile import ZIP_DEFLATED, ZipFile
          files = (
              "LS_Elza/selection_intent.py",
              "LS_Elza/selection_guard.py",
              "LS_Elza/locf_intent.py",
              "LS_Elza/ls_adapter/runtime_bridge.py",
              "LS_Elza/__init__.py",
              "LS_Elza/v230_ui_enhancer.py",
              "LS_Elza/ui.py",
              "LS_Elza/service.py",
              "ls_web/elza_selection_bridge.py",
              "ls_web/elza_adapter.py",
              "ls_web/elza_controller.py",
              "ls_web/elza_selftest.py",
          )
          with ZipFile("Elza-v2.45.zip", "w", ZIP_DEFLATED) as archive:
              for name in files:
                  archive.write(name, name)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Elza-v2.45
          path: Elza-v2.45.zip
          if-no-files-found: error

# Final v2.45 packaging verification trigger.
