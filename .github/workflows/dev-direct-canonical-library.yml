name: Dev v2.27 Direct Canonical Library proof

on:
  push:
    branches:
      - feat/direct-canonical-library-user-proof

jobs:
  prove-direct-library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused test dependencies
        run: |
          python -m pip install pytest playwright
          python -m playwright install --with-deps chromium

      - name: Build exact v2.27 user-test overlay
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile

          files = [
              Path("LocalSunoDb.py"),
              Path("ls_core/runtime.py"),
              Path("ls_data/database_context.py"),
              Path("ls_data/repository.py"),
              Path("ls_audio/service.py"),
              Path("ls_library/static/suno_library_lazy_loader.js"),
              Path("ls_web/app.py"),
          ]
          out = Path("LocalSunoDb_v2.27.zip")
          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as archive:
              for item in files:
                  if not item.is_file():
                      raise SystemExit(f"Missing overlay file: {item}")
                  archive.write(item, item.as_posix())
          with zipfile.ZipFile(out) as archive:
              assert archive.namelist() == [item.as_posix() for item in files]
          PY

      - name: Verify Direct Library source contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          source = Path("ls_data/repository.py").read_text(encoding="utf-8")

          def function_body(name, next_name):
              start = source.index("def " + name + "(")
              end = source.index("def " + next_name + "(", start + 1)
              return source[start:end]

          canonical_connection = function_body("get_canonical_connection", "get_connection")
          assert "configure_legacy_runtime_views" not in canonical_connection

          direct_sections = "\n".join([
              function_body("build_track_filter_query_parts", "_decode_track_page_cursor"),
              function_body("_track_cursor_predicate", "search_tracks"),
              function_body("search_tracks", "count_tracks"),
              function_body("count_tracks", "get_stem_counts_for_track_ids"),
              function_body("get_stem_counts_for_track_ids", "get_stems_for_track"),
              function_body("get_confirmed_local_audio_paths_for_render", "get_best_local_audio_paths_for_render"),
          ])
          forbidden_sql_sources = [
              "track_ui",
              "local_audio_files",
              "workspaceName",
              "metadata_duration",
              "duration_text",
              "bpm_text",
              "model_badge",
              "tu.ui_type",
          ]
          for token in forbidden_sql_sources:
              assert token not in direct_sections, token

          assert "main.tracks" in direct_sections
          assert "main.track_user" in direct_sections
          assert "main.track_variants" in direct_sections
          assert "main.media_files" in direct_sections
          assert "t.workspace_name" in direct_sections
          assert "t.source_task" in direct_sections
          assert "t.duration_seconds" in direct_sections
          assert "t.avg_bpm" in function_body("search_tracks", "count_tracks")
          assert "t.style_tags" in direct_sections
          assert "t.is_liked" in direct_sections
          assert Path("ls_data/database_context.py").is_file()
          assert Path("ls_web/app.py").is_file()
          audio_source = Path("ls_audio/service.py").read_text(encoding="utf-8")
          assert "if _is_browser_safe_pcm16_wav(source):" in audio_source
          lazy_source = Path("ls_library/static/suno_library_lazy_loader.js").read_text(encoding="utf-8")
          assert "root: null" in lazy_source
          assert "root: tableWrap" not in lazy_source
          PY

      - name: Apply exact overlay over current main baseline
        run: |
          git worktree add exact-overlay 26e62b38b46e9829c043d8bbc4ff5402184b60e9
          rm -f exact-overlay/ls_data/database_context.py exact-overlay/ls_web/app.py
          unzip -o LocalSunoDb_v2.27.zip -d exact-overlay
          test -f exact-overlay/ls_data/database_context.py
          test -f exact-overlay/ls_web/app.py
          mkdir -p exact-overlay/tests/browser
          cp tests/test_direct_canonical_library.py exact-overlay/tests/
          cp tests/test_fresh_install_local_library.py exact-overlay/tests/
          cp tests/test_local_playlists.py exact-overlay/tests/
          cp tests/test_local_suno_runtime.py exact-overlay/tests/
          cp tests/browser/seed_direct_library_fixture.py exact-overlay/tests/browser/
          cp tests/browser/test_direct_library_cutover.py exact-overlay/tests/browser/

      - name: Syntax checks on exact overlay
        run: |
          python -m py_compile             exact-overlay/LocalSunoDb.py             exact-overlay/ls_core/runtime.py             exact-overlay/ls_data/database_context.py             exact-overlay/ls_data/repository.py             exact-overlay/ls_audio/service.py             exact-overlay/ls_web/app.py             exact-overlay/tests/test_direct_canonical_library.py             exact-overlay/tests/browser/seed_direct_library_fixture.py             exact-overlay/tests/browser/test_direct_library_cutover.py
          node --check exact-overlay/ls_library/static/suno_library_lazy_loader.js

      - name: Run focused canonical regressions
        run: |
          cd exact-overlay
          python -m pytest -q             tests/test_direct_canonical_library.py             tests/test_fresh_install_local_library.py             tests/test_local_suno_runtime.py             tests/test_local_playlists.py

      - name: Seed exact canonical browser fixture
        run: |
          cd exact-overlay
          rm -rf Data Temp Reports Logs browser-artifacts
          python tests/browser/seed_direct_library_fixture.py

      - name: Start exact overlay
        run: |
          cd exact-overlay
          python LocalSunoDb.py --ls-restarted > ../v227-server.log 2>&1 &
          echo $! > ../v227-server.pid
          cd ..
          python - <<'PY'
          import time
          from urllib.request import urlopen
          for _ in range(160):
              try:
                  with urlopen("http://127.0.0.1:8765/app-version", timeout=1) as response:
                      body = response.read().decode("utf-8", "replace")
                      if response.status == 200 and "v2.27" in body:
                          raise SystemExit(0)
              except Exception:
                  time.sleep(0.25)
          raise SystemExit("v2.27 exact overlay did not start")
          PY

      - name: Run real Direct Library browser cutover
        run: |
          cd exact-overlay
          python tests/browser/test_direct_library_cutover.py

      - name: Stop exact overlay before benchmark
        if: always()
        run: |
          if [ -f v227-server.pid ]; then
            kill "$(cat v227-server.pid)" || true
            sleep 1
          fi

      - name: Prepare baseline benchmark worktree
        run: |
          git worktree add baseline-before 26e62b38b46e9829c043d8bbc4ff5402184b60e9
          mkdir -p baseline-before/tests/browser
          cp tests/browser/seed_direct_library_fixture.py baseline-before/tests/browser/
          cd baseline-before
          rm -rf Data Temp Reports Logs
          python tests/browser/seed_direct_library_fixture.py

      - name: Benchmark legacy-view Library baseline
        run: |
          cd baseline-before
          python LocalSunoDb.py --ls-restarted > ../baseline-server.log 2>&1 &
          echo $! > ../baseline-server.pid
          cd ..
          python - <<'PY'
          import json
          import statistics
          import time
          from urllib.request import urlopen

          base = "http://127.0.0.1:8765"
          paths = {
              "initial_page": "/",
              "initial_rows": "/library-rows?batch=32",
              "type_cover": "/library-rows?batch=32&kind_filter=Cover",
              "category_instrumental": "/library-rows?batch=32&category_filter=Instrumental",
              "local_audio": "/library-rows?batch=32&local_audio_filter=with",
          }

          for _ in range(160):
              try:
                  with urlopen(base + "/app-version", timeout=1) as response:
                      if response.status == 200:
                          break
              except Exception:
                  time.sleep(0.25)
          else:
              raise SystemExit("baseline server did not start")

          result = {}
          for label, path in paths.items():
              for _ in range(2):
                  with urlopen(base + path, timeout=10) as response:
                      response.read()
              samples = []
              for _ in range(9):
                  started = time.perf_counter()
                  with urlopen(base + path, timeout=10) as response:
                      response.read()
                  samples.append((time.perf_counter() - started) * 1000.0)
              result[label] = {
                  "median_ms": round(statistics.median(samples), 3),
                  "min_ms": round(min(samples), 3),
                  "samples_ms": [round(value, 3) for value in samples],
              }

          with open("benchmark-before.json", "w", encoding="utf-8") as handle:
              json.dump(result, handle, indent=2)
          print(json.dumps(result, indent=2))
          PY
          kill "$(cat baseline-server.pid)" || true
          sleep 1

      - name: Benchmark Direct Canonical Library
        run: |
          cd exact-overlay
          python LocalSunoDb.py --ls-restarted > ../direct-server.log 2>&1 &
          echo $! > ../direct-server.pid
          cd ..
          python - <<'PY'
          import json
          import statistics
          import time
          from urllib.request import urlopen

          base = "http://127.0.0.1:8765"
          paths = {
              "initial_page": "/",
              "initial_rows": "/library-rows?batch=32",
              "type_cover": "/library-rows?batch=32&kind_filter=Cover",
              "category_instrumental": "/library-rows?batch=32&category_filter=Instrumental",
              "local_audio": "/library-rows?batch=32&local_audio_filter=with",
          }

          for _ in range(160):
              try:
                  with urlopen(base + "/app-version", timeout=1) as response:
                      if response.status == 200:
                          break
              except Exception:
                  time.sleep(0.25)
          else:
              raise SystemExit("direct server did not start")

          result = {}
          for label, path in paths.items():
              for _ in range(2):
                  with urlopen(base + path, timeout=10) as response:
                      response.read()
              samples = []
              for _ in range(9):
                  started = time.perf_counter()
                  with urlopen(base + path, timeout=10) as response:
                      response.read()
                  samples.append((time.perf_counter() - started) * 1000.0)
              result[label] = {
                  "median_ms": round(statistics.median(samples), 3),
                  "min_ms": round(min(samples), 3),
                  "samples_ms": [round(value, 3) for value in samples],
              }

          with open("benchmark-after.json", "w", encoding="utf-8") as handle:
              json.dump(result, handle, indent=2)
          print(json.dumps(result, indent=2))
          PY
          kill "$(cat direct-server.pid)" || true
          sleep 1

      - name: Compare before and after timing
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          before = json.loads(Path("benchmark-before.json").read_text())
          after = json.loads(Path("benchmark-after.json").read_text())
          rows = {}
          for key in before:
              b = float(before[key]["median_ms"])
              a = float(after[key]["median_ms"])
              rows[key] = {
                  "before_median_ms": b,
                  "after_median_ms": a,
                  "change_percent": round(((a - b) / b) * 100.0, 1) if b else None,
              }
          Path("direct-library-benchmark.json").write_text(
              json.dumps(rows, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(rows, indent=2))
          PY

      - name: Upload exact proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LocalSunoDb-v2.27-direct-canonical-library
          path: |
            LocalSunoDb_v2.27.zip
            v227-server.log
            baseline-server.log
            direct-server.log
            benchmark-before.json
            benchmark-after.json
            direct-library-benchmark.json
            exact-overlay/browser-artifacts/
          if-no-files-found: warn
          retention-days: 3
