name: Persistent shell v2.28.2 proof

on:
  push:
    branches:
      - feat/persistent-shell-v2282-clean
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install proof dependencies
        run: |
          python -m pip install pytest playwright
          python -m playwright install --with-deps chromium

      - name: Verify v2.28.2 syntax and identity
        run: |
          python -m py_compile             LocalSunoDb.py             ls_core/runtime.py             ls_data/music_library.py             ls_library/controller.py             ls_library/music_browser.py             ls_library/playlists.py             ls_library/render.py             ls_web/handler.py             ls_web/render.py
          python - <<'PY'
          from pathlib import Path
          for path in ("LocalSunoDb.py", "ls_core/runtime.py"):
              text = Path(path).read_text(encoding="utf-8")
              assert 'APP_VERSION = "v2.28.2"' in text, path
          shell = Path("ls_web/static/persistent_shell.js").read_text(encoding="utf-8")
          assert "LS_SHELL_NAVIGATE" in shell
          assert "LS_SHELL_AUDIO_PLAY" in shell
          assert "LS_SHELL_PAUSE_AUDIO" in shell
          PY

      - name: Focused regressions
        run: |
          python -m pytest -q tests/test_backend_restart.py
          python -m pytest -q tests/test_local_playlists.py -k "not test_v228_identity_is_based_on_v227"

      - name: Seed separate My Library audio DB
        run: |
          python - <<'PY'
          import math
          import struct
          import wave
          from pathlib import Path
          from ls_data.music_library import create_or_update_music_database

          root = Path("/tmp/ls-persistent-music")
          album = root / "[2026] - Persistent Artist - Persistent Album"
          album.mkdir(parents=True, exist_ok=True)
          wav_path = album / "01 - Persistent Tone.wav"
          sample_rate = 8000
          duration = 30
          with wave.open(str(wav_path), "wb") as handle:
              handle.setnchannels(1)
              handle.setsampwidth(2)
              handle.setframerate(sample_rate)
              frames = bytearray()
              for index in range(sample_rate * duration):
                  value = int(6500 * math.sin(2 * math.pi * 220 * index / sample_rate))
                  frames.extend(struct.pack("<h", value))
              handle.writeframes(bytes(frames))

          result = create_or_update_music_database(
              "Persistent Test",
              str(root),
              "Test",
          )
          assert result["ok"], result
          assert int(result["track_count"]) >= 1, result
          print(result)
          PY

      - name: Start exact preview server
        run: |
          python LocalSunoDb.py --ls-restarted > persistent-shell-server.log 2>&1 &
          echo $! > persistent-shell-server.pid
          python - <<'PY'
          import time
          from urllib.request import urlopen
          for _ in range(160):
              try:
                  with urlopen("http://127.0.0.1:8765/app-version", timeout=1) as response:
                      if response.status == 200 and b"v2.28.2" in response.read():
                          raise SystemExit(0)
              except Exception:
                  time.sleep(0.25)
          raise SystemExit("v2.28.2 server did not start")
          PY

      - name: Prove persistent sidebar and audio in Chromium
        run: |
          python - <<'PY'
          import time
          from playwright.sync_api import sync_playwright

          base = "http://127.0.0.1:8765"

          def frame_with(page, needle):
              for frame in page.frames:
                  if needle in frame.url:
                      return frame
              return None

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page(viewport={"width": 1440, "height": 960})
              errors = []
              page.on("pageerror", lambda exc: errors.append(str(exc)))

              response = page.goto(base + "/", wait_until="domcontentloaded", timeout=30000)
              assert response and response.ok, response.status if response else None
              page.wait_for_timeout(500)
              setup_modal = page.locator("#fresh-install-modal")
              if setup_modal.count():
                  setup_modal.evaluate("(el) => el.remove()")

              assert page.locator(".ls-sidebar-title-full").inner_text().strip() == "LS v2.28.2"
              expected = [
                  "Suno Library",
                  "My Library",
                  "Playlists",
                  "Stems",
                  "Imports",
                  "Explore",
                  "LS Elza",
                  "Rīki",
              ]
              labels = [
                  value.strip()
                  for value in page.locator(
                      "header .header-tabs .ls-sidebar-label"
                  ).all_inner_texts()
              ]
              assert labels == expected, labels
              header_box = page.locator("body#ls-library > header").bounding_box()
              assert header_box and header_box["width"] > 200, header_box

              page.locator('header .header-tabs a[href="/my-library"]').click()
              page.wait_for_url("**/my-library", timeout=10000)
              page.wait_for_timeout(800)
              assert page.locator("body#ls-library > header").is_visible()
              assert page.locator("#ls-shell-screen-host iframe.is-active").count() == 1

              my_frame = frame_with(page, "/my-library?ls_embedded=1")
              assert my_frame is not None, [frame.url for frame in page.frames]
              assert "ls-shell-embedded" in my_frame.locator("html").get_attribute("class")
              assert my_frame.locator(".side").evaluate(
                  "(el) => getComputedStyle(el).display"
              ) == "none"

              my_frame.locator("#list-view").click()
              page.wait_for_url("**/my-library?*view=list*", timeout=10000)
              page.wait_for_timeout(800)
              list_frame = frame_with(page, "view=list")
              assert list_frame is not None, [frame.url for frame in page.frames]
              play = list_frame.locator(".music-row-play").first
              play.wait_for(state="visible", timeout=5000)
              play.click()

              list_frame.locator("#my-player-audio").evaluate(
                  """async (audio) => {
                      const deadline = Date.now() + 5000;
                      while ((audio.paused || audio.currentTime <= 0.05) && Date.now() < deadline) {
                          await new Promise(resolve => setTimeout(resolve, 100));
                      }
                      if (audio.paused || audio.currentTime <= 0.05) {
                          throw new Error("My Library audio did not start");
                      }
                  }"""
              )
              before = float(list_frame.locator("#my-player-audio").evaluate("(audio) => audio.currentTime"))

              page.locator('header .header-tabs a[href="/playlists"]').click()
              page.wait_for_url("**/playlists", timeout=10000)
              page.wait_for_timeout(1200)
              playlists_frame = frame_with(page, "/playlists?ls_embedded=1")
              assert playlists_frame is not None, [frame.url for frame in page.frames]
              assert page.locator("body#ls-library > header").is_visible()
              assert playlists_frame.locator(".playlist-topbar").evaluate(
                  "(el) => getComputedStyle(el).display"
              ) == "none"

              after = float(list_frame.locator("#my-player-audio").evaluate("(audio) => audio.currentTime"))
              paused = bool(list_frame.locator("#my-player-audio").evaluate("(audio) => audio.paused"))
              assert not paused, (before, after, paused)
              assert after > before + 0.5, (before, after)

              page.locator('header .header-tabs a[href="/downloader"]').click()
              page.wait_for_url("**/downloader", timeout=10000)
              page.wait_for_timeout(700)
              downloader_frame = frame_with(page, "/downloader?ls_embedded=1")
              assert downloader_frame is not None, [frame.url for frame in page.frames]
              assert downloader_frame.locator("header").evaluate(
                  "(el) => getComputedStyle(el).display"
              ) == "none"
              assert page.locator("body#ls-library > header").is_visible()

              page.locator('header .header-tabs a[href="/"]').click()
              page.wait_for_url(base + "/", timeout=10000)
              page.wait_for_timeout(700)
              assert page.locator("body#ls-library > header").is_visible()
              later = float(list_frame.locator("#my-player-audio").evaluate("(audio) => audio.currentTime"))
              assert later > after + 0.3, (after, later)
              assert not bool(list_frame.locator("#my-player-audio").evaluate("(audio) => audio.paused"))

              assert not errors, errors
              browser.close()
          PY

      - name: Build exact v2.28.2 preview overlay
        run: |
          python - <<'PY'
          import subprocess
          import zipfile
          from pathlib import Path

          changed = subprocess.check_output(
              ["git", "diff", "--name-only", "origin/main...HEAD"],
              text=True,
          ).splitlines()

          files = []
          for name in changed:
              path = Path(name)
              if not path.is_file():
                  continue
              if name.startswith(".github/") or name.startswith("tests/"):
                  continue
              if name.startswith(("Data/", "Logs/", "Reports/", "Backup/", "Temp/")):
                  continue
              if path.suffix.lower() in {
                  ".db", ".db-shm", ".db-wal", ".wav", ".mp3",
                  ".flac", ".m4a", ".aac", ".ogg"
              }:
                  continue
              files.append(name)

          required = {
              "LocalSunoDb.py",
              "ls_core/runtime.py",
              "ls_data/music_library.py",
              "ls_library/music_browser.py",
              "ls_web/static/persistent_shell.js",
              "ls_web/static/persistent_shell.css",
          }
          assert required <= set(files), (required - set(files), files)

          out = Path("LocalSunoDb_v2.28.2_persistent_shell_preview.zip")
          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as archive:
              for name in sorted(files):
                  archive.write(name, name)
          print("\n".join(sorted(files)))
          PY

      - name: Verify exact ZIP over clean main
        run: |
          rm -rf /tmp/ls-v2282-overlay
          git worktree add --detach /tmp/ls-v2282-overlay origin/main
          python - <<'PY'
          import zipfile
          from pathlib import Path
          archive = Path("LocalSunoDb_v2.28.2_persistent_shell_preview.zip").resolve()
          target = Path("/tmp/ls-v2282-overlay")
          with zipfile.ZipFile(archive, "r") as zf:
              names = zf.namelist()
              assert not any(
                  name.casefold().startswith(
                      ("data/", "logs/", "reports/", "backup/", "temp/")
                  )
                  for name in names
              ), names
              zf.extractall(target)
          PY
          cd /tmp/ls-v2282-overlay
          python -m py_compile             LocalSunoDb.py             ls_core/runtime.py             ls_data/music_library.py             ls_library/controller.py             ls_library/music_browser.py             ls_library/playlists.py             ls_library/render.py             ls_web/handler.py             ls_web/render.py
          python LocalSunoDb.py --ls-update-probe | tee /tmp/ls-v2282-probe.log
          grep -q "LS_UPDATE_PROBE_OK" /tmp/ls-v2282-probe.log

      - name: Upload exact preview ZIP
        uses: actions/upload-artifact@v4
        with:
          name: LocalSunoDb-v2.28.2-persistent-shell-preview
          path: LocalSunoDb_v2.28.2_persistent_shell_preview.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v2282-persistent-shell-diagnostics
          path: |
            persistent-shell-server.log
          if-no-files-found: warn
          retention-days: 3

      - name: Stop server
        if: always()
        run: |
          if [ -f persistent-shell-server.pid ]; then kill "$(cat persistent-shell-server.pid)" || true; fi
