name: Dev v2.26 Music DB browser proof

on:
  push:
    branches:
      - feat/v226-music-db-browser

jobs:
  prove-v226:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused test dependencies
        run: |
          python -m pip install pytest playwright
          python -m playwright install --with-deps chromium

      - name: Build exact v2.26 user-test overlay
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile

          files = [
              Path("LocalSunoDb.py"),
              Path("ls_core/runtime.py"),
              Path("ls_data/music_library.py"),
              Path("ls_library/music_browser.py"),
              Path("ls_library/templates/library.html"),
              Path("ls_library/static/suno_menu_search_core_script_assets.js"),
              Path("ls_library/static/suno_settings_actions_script_assets.js"),
              Path("ls_web/handler.py"),
          ]
          out = Path("LocalSunoDb_v2.26.zip")
          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as archive:
              for item in files:
                  if not item.is_file():
                      raise SystemExit(f"Missing overlay file: {item}")
                  archive.write(item, item.as_posix())
          with zipfile.ZipFile(out) as archive:
              expected = [item.as_posix() for item in files]
              if archive.namelist() != expected:
                  raise SystemExit(f"Unexpected ZIP contents: {archive.namelist()}")
          PY

      - name: Verify exact overlay contract
        run: |
          python - <<'PY'
          import zipfile

          with zipfile.ZipFile("LocalSunoDb_v2.26.zip") as archive:
              data = {name: archive.read(name).decode("utf-8") for name in archive.namelist()}

          assert 'APP_VERSION = "v2.26"' in data["LocalSunoDb.py"]
          assert 'APP_VERSION = "v2.26"' in data["ls_core/runtime.py"]
          assert "def search_music_database" in data["ls_data/music_library.py"]
          assert "def get_music_database_cover" in data["ls_data/music_library.py"]
          assert "def render_music_database_page" in data["ls_library/music_browser.py"]
          assert 'id="open-music-db-browser-btn"' in data["ls_library/templates/library.html"]
          assert "Mūzikas DB…" in data["ls_library/templates/library.html"]
          assert 'window.location.href = "/music-db"' in data["ls_library/static/suno_settings_actions_script_assets.js"]
          assert 'if path == "/music-db":' in data["ls_web/handler.py"]
          assert 'if path == "/music-db-cover":' in data["ls_web/handler.py"]
          PY

      - name: Apply exact overlay over v2.25 user-test baseline
        run: |
          git worktree add baseline-v225 bb8df45a6042b30b4156191e9a749fc27c1fdee4
          unzip -o LocalSunoDb_v2.26.zip -d baseline-v225
          mkdir -p baseline-v225/tests/browser
          cp tests/test_music_library_db.py baseline-v225/tests/
          cp tests/test_fresh_install_local_library.py baseline-v225/tests/
          cp tests/test_local_playlists.py baseline-v225/tests/
          cp tests/browser/test_fresh_install_setup.py baseline-v225/tests/browser/

      - name: Syntax checks on delivered overlay
        run: |
          python -m py_compile             baseline-v225/LocalSunoDb.py             baseline-v225/ls_core/runtime.py             baseline-v225/ls_data/music_library.py             baseline-v225/ls_library/music_browser.py             baseline-v225/ls_web/handler.py
          node --check baseline-v225/ls_library/static/suno_menu_search_core_script_assets.js
          node --check baseline-v225/ls_library/static/suno_settings_actions_script_assets.js

      - name: Run focused regressions on exact overlay
        run: |
          cd baseline-v225
          python -m pytest -q             tests/test_music_library_db.py             tests/test_fresh_install_local_library.py             tests/test_local_playlists.py

      - name: Start exact delivered overlay
        run: |
          rm -rf baseline-v225/Data baseline-v225/Temp baseline-v225/Reports baseline-v225/Logs
          cd baseline-v225
          python LocalSunoDb.py --ls-restarted > ../v226-server.log 2>&1 &
          echo $! > ../v226-server.pid
          cd ..
          python - <<'PY'
          import time
          from urllib.request import urlopen

          for _ in range(120):
              try:
                  with urlopen("http://127.0.0.1:8765/app-version", timeout=1) as response:
                      body = response.read().decode("utf-8", "replace")
                      if response.status == 200 and "v2.26" in body:
                          raise SystemExit(0)
              except Exception:
                  time.sleep(0.25)
          raise SystemExit("v2.26 did not start")
          PY

      - name: Run Music DB browser flow
        run: |
          cd baseline-v225
          python tests/browser/test_fresh_install_setup.py

      - name: Upload exact user-test ZIP and proof log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LocalSunoDb-v2.26-music-db-browser-verified
          path: |
            LocalSunoDb_v2.26.zip
            v226-server.log
          if-no-files-found: error
          retention-days: 2

      - name: Stop exact overlay
        if: always()
        run: |
          if [ -f v226-server.pid ]; then
            kill "$(cat v226-server.pid)" || true
          fi
