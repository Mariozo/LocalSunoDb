name: Dev v2.24 fresh install local library proof

on:
  push:
    branches:
      - feat/fresh-install-local-library

jobs:
  prove-v224:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused test dependencies
        run: |
          python -m pip install pytest playwright
          python -m playwright install --with-deps chromium

      - name: Build exact v2.24 user-test overlay
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile

          files = [
              Path("LocalSunoDb.py"),
              Path("ls_core/runtime.py"),
              Path("ls_core/service.py"),
              Path("ls_data/repository.py"),
              Path("ls_library/controller.py"),
              Path("ls_library/templates/library.html"),
              Path("ls_library/static/suno_menu_search_core_script_assets.js"),
              Path("ls_library/static/suno_settings_actions_script_assets.js"),
              Path("ls_web/handler.py"),
          ]
          out = Path("LocalSunoDb_v2.24.zip")
          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as archive:
              for item in files:
                  if not item.is_file():
                      raise SystemExit(f"Missing overlay file: {item}")
                  archive.write(item, item.as_posix())
          with zipfile.ZipFile(out) as archive:
              expected = [item.as_posix() for item in files]
              if archive.namelist() != expected:
                  raise SystemExit(f"Unexpected ZIP contents: {archive.namelist()}")
          PY

      - name: Verify exact overlay contract
        run: |
          python - <<'PY'
          import zipfile

          with zipfile.ZipFile("LocalSunoDb_v2.24.zip") as archive:
              data = {name: archive.read(name).decode("utf-8") for name in archive.namelist()}

          assert 'APP_VERSION = "v2.24"' in data["LocalSunoDb.py"]
          assert 'APP_VERSION = "v2.24"' in data["ls_core/runtime.py"]
          assert "create_local_suno_schema" in data["ls_data/repository.py"]
          assert "def import_local_audio_library" in data["ls_data/repository.py"]
          assert "def send_fresh_install_state" in data["ls_library/controller.py"]
          assert "/import-local-library" in data["ls_library/controller.py"]
          assert "/fresh-install-state" in data["ls_web/handler.py"]
          assert 'id="fresh-install-modal"' in data["ls_library/templates/library.html"]
          assert "Izveidot / piepildīt DB" in data["ls_library/templates/library.html"]
          assert 'fetch("/import-local-library"' in data["ls_library/static/suno_settings_actions_script_assets.js"]
          assert 'loadFreshInstallState(true)' in data["ls_library/static/suno_settings_actions_script_assets.js"]
          PY

      - name: Apply exact overlay over current main baseline
        run: |
          git worktree add baseline-main 9555d0a5062309e1a9966a0723f0df3053cf21fa
          unzip -o LocalSunoDb_v2.24.zip -d baseline-main
          mkdir -p baseline-main/tests/browser
          cp tests/test_fresh_install_local_library.py baseline-main/tests/
          cp tests/test_local_playlists.py baseline-main/tests/
          cp tests/browser/test_fresh_install_setup.py baseline-main/tests/browser/

      - name: Syntax checks on delivered overlay
        run: |
          python -m py_compile             baseline-main/LocalSunoDb.py             baseline-main/ls_core/runtime.py             baseline-main/ls_core/service.py             baseline-main/ls_data/repository.py             baseline-main/ls_library/controller.py             baseline-main/ls_web/handler.py
          node --check baseline-main/ls_library/static/suno_menu_search_core_script_assets.js
          node --check baseline-main/ls_library/static/suno_settings_actions_script_assets.js

      - name: Run focused unit regressions on exact overlay
        run: |
          cd baseline-main
          python -m pytest -q tests/test_fresh_install_local_library.py tests/test_local_playlists.py

      - name: Start exact delivered overlay as a fresh install
        run: |
          rm -rf baseline-main/Data baseline-main/Temp baseline-main/Reports baseline-main/Logs
          cd baseline-main
          python LocalSunoDb.py --ls-restarted > ../fresh-install-server.log 2>&1 &
          echo $! > ../fresh-install-server.pid
          cd ..
          python - <<'PY'
          import time
          from urllib.request import urlopen

          for _ in range(120):
              try:
                  with urlopen("http://127.0.0.1:8765/app-version", timeout=1) as response:
                      body = response.read().decode("utf-8", "replace")
                      if response.status == 200 and "v2.24" in body:
                          raise SystemExit(0)
              except Exception:
                  time.sleep(0.25)
          raise SystemExit("v2.24 fresh install did not start")
          PY

      - name: Run fresh-install browser flow
        run: |
          cd baseline-main
          python tests/browser/test_fresh_install_setup.py

      - name: Upload exact user-test ZIP and proof log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LocalSunoDb-v2.24-fresh-install-browser-verified
          path: |
            LocalSunoDb_v2.24.zip
            fresh-install-server.log
          if-no-files-found: error
          retention-days: 2

      - name: Stop exact overlay
        if: always()
        run: |
          if [ -f fresh-install-server.pid ]; then
            kill "$(cat fresh-install-server.pid)" || true
          fi
