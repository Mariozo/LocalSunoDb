name: Dev v2.21 Playlist recovery browser proof

on:
  push:
    branches:
      - fix/v219-browser-verified-select-audio

jobs:
  prove-v221:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused test dependencies
        run: |
          python -m pip install pytest playwright
          python -m playwright install --with-deps chromium

      - name: Build exact v2.21 user-test overlay
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile

          files = [
              Path("LocalSunoDb.py"),
              Path("ls_core/runtime.py"),
              Path("ls_library/playlists.py"),
              Path("ls_library/templates/library.html"),
              Path("ls_library/static/suno_filter_layout_dock_style_assets.css"),
              Path("ls_library/static/suno_selection_state_script.js"),
              Path("ls_library/static/suno_sidebar_stats_search_events_script_assets.js"),
              Path("ls_library/static/suno_library_lazy_loader.js"),
              Path("ls_web/pages.py"),
          ]
          out = Path("LocalSunoDb_v2.21.zip")
          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as archive:
              for path in files:
                  if not path.is_file():
                      raise SystemExit(f"Missing overlay file: {path}")
                  archive.write(path, path.as_posix())
          with zipfile.ZipFile(out) as archive:
              expected = [path.as_posix() for path in files]
              if archive.namelist() != expected:
                  raise SystemExit(f"Unexpected ZIP contents: {archive.namelist()}")
          PY

      - name: Verify exact overlay contract and line endings
        run: |
          python - <<'PY'
          import zipfile

          with zipfile.ZipFile("LocalSunoDb_v2.21.zip") as archive:
              data = {name: archive.read(name) for name in archive.namelist()}

          entry = data["LocalSunoDb.py"].decode("utf-8")
          runtime = data["ls_core/runtime.py"].decode("utf-8")
          playlists = data["ls_library/playlists.py"].decode("utf-8")
          template = data["ls_library/templates/library.html"].decode("utf-8")
          selection = data["ls_library/static/suno_selection_state_script.js"].decode("utf-8")
          search_events = data["ls_library/static/suno_sidebar_stats_search_events_script_assets.js"].decode("utf-8")
          lazy = data["ls_library/static/suno_library_lazy_loader.js"].decode("utf-8")
          pages = data["ls_web/pages.py"].decode("utf-8")

          assert "# Based on: v2.20" in entry
          assert 'APP_VERSION = "v2.21"' in entry
          assert 'APP_BASED_ON = "v2.20"' in entry
          assert 'APP_VERSION = "v2.21"' in runtime
          assert 'APP_BASED_ON = "v2.20"' in runtime
          assert '<span class="ls-sidebar-title-full">LS @@LS0@@</span>' in template

          assert 'item["track_ids"] = added + current' in playlists
          assert 'data-play-source="{esc(play_source)}"' in playlists
          assert 'row.dataset.playSource || "suno"' in playlists
          assert "clearSelectedTracks" in playlists
          assert "clearSelectedTracks()" in selection
          assert 'event.key === "F4"' in search_events
          assert 'window.addEventListener("pageshow"' in lazy
          assert 'sort_by = "created"' in pages
          assert 'sort_dir = "desc"' in pages

          for name, blob in data.items():
              crlf = blob.count(b"\r\n")
              lf = blob.count(b"\n")
              if crlf and (lf - crlf):
                  raise SystemExit(f"Mixed line endings: {name}")
          PY

      - name: Apply exact overlay over exact v2.20 user-test state
        run: |
          git worktree add baseline-v220 d2ed614c46b2dced30853b4a6c4b94e976a7c3f2
          unzip -o LocalSunoDb_v2.21.zip -d baseline-v220
          mkdir -p baseline-v220/tests/browser
          cp tests/browser/seed_select_audio_fixture.py baseline-v220/tests/browser/
          cp tests/browser/test_select_audio_flow.py baseline-v220/tests/browser/
          cp tests/browser/test_playlist_end_to_end.py baseline-v220/tests/browser/
          cp tests/test_local_playlists.py baseline-v220/tests/test_local_playlists.py

      - name: Focused syntax checks on delivered overlay
        run: |
          python -m py_compile             baseline-v220/LocalSunoDb.py             baseline-v220/ls_core/runtime.py             baseline-v220/ls_library/playlists.py             baseline-v220/ls_web/pages.py
          node --check baseline-v220/ls_library/static/suno_selection_state_script.js
          node --check baseline-v220/ls_library/static/suno_sidebar_stats_search_events_script_assets.js
          node --check baseline-v220/ls_library/static/suno_library_lazy_loader.js
          python - <<'PY'
          from pathlib import Path
          import sys

          root = Path("baseline-v220").resolve()
          sys.path.insert(0, str(root))
          from ls_library.playlists import render_playlist_library_actions_script

          rendered = render_playlist_library_actions_script().strip()
          body = rendered[len("<script>"):].rsplit("</script>", 1)[0]
          Path("playlist_actions_v221.js").write_text(body, encoding="utf-8", newline="\n")
          PY
          node --check playlist_actions_v221.js

      - name: Seed isolated browser fixture
        run: python baseline-v220/tests/browser/seed_select_audio_fixture.py

      - name: Start exact delivered overlay
        run: |
          cd baseline-v220
          python LocalSunoDb.py --ls-restarted > ../browser-server.log 2>&1 &
          echo $! > ../browser-server.pid
          cd ..
          python - <<'PY'
          import time
          from urllib.request import urlopen

          for _ in range(120):
              try:
                  with urlopen("http://127.0.0.1:8765/app-version", timeout=1) as response:
                      body = response.read().decode("utf-8", "replace")
                      if response.status == 200 and "v2.21" in body:
                          raise SystemExit(0)
              except Exception:
                  time.sleep(0.25)
          raise SystemExit("v2.21 overlay did not start")
          PY

      - name: Run real browser flow on exact delivered overlay
        run: |
          cd baseline-v220
          python tests/browser/test_playlist_end_to_end.py

      - name: Run focused Playlist regressions on exact delivered overlay
        run: |
          cd baseline-v220
          python -m pytest -q tests/test_local_playlists.py

      - name: Upload exact user-test ZIP and browser proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LocalSunoDb-v2.21-playlist-recovery-browser-verified
          path: |
            LocalSunoDb_v2.21.zip
            baseline-v220/browser-artifacts/
            browser-server.log
          if-no-files-found: error
          retention-days: 2

      - name: Stop exact overlay
        if: always()
        run: |
          if [ -f browser-server.pid ]; then
            kill "$(cat browser-server.pid)" || true
          fi
