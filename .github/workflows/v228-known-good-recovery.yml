name: v2.28 known-good recovery

on:
  push:
    branches:
      - recovery/v228-known-good-package

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify proven v2.28 runtime
        run: |
          python -m py_compile LocalSunoDb.py ls_core/runtime.py ls_library/render.py ls_library/playlists.py ls_web/app.py
          python -m pip install pytest
          python -m pytest -q tests/test_backend_restart.py tests/test_local_playlists.py

  package:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build recovery ZIP preserving user state and Elza
        run: |
          python - <<'PY'
          import subprocess, zipfile
          from pathlib import Path

          include_roots = (
              "LS_Suno_TokenBridge/",
              "ls_audio/",
              "ls_core/",
              "ls_data/",
              "ls_downloader/",
              "ls_library/",
              "ls_media/",
              "ls_player/",
              "ls_stems/",
              "ls_suno/",
              "ls_tools/",
              "ls_upgrade/",
              "ls_web/",
          )
          include_files = {
              "LocalSunoDb.py",
              "Start_LocalSunoDb.cmd",
              "RESTART_BACKEND.cmd",
              "INSTALL_v1.16_backend.cmd",
          }

          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          names = [name for name in tracked if name in include_files or name.startswith(include_roots)]

          forbidden = (
              "Data/", "Logs/", "Backup/", "Temp/", "Reports/", "exports/",
              "LS_Elza/", ".github/", "tests/",
          )
          assert not any(name.startswith(forbidden) for name in names)

          ps1 = r'''param([switch]$NoBrowser)
$ErrorActionPreference = "Stop"
$Root = Split-Path -Parent $MyInvocation.MyCommand.Path
Set-Location $Root
$Log = Join-Path $Root "RECOVER_V228.log"
Remove-Item $Log -Force -ErrorAction SilentlyContinue
function Log([string]$Text) { Add-Content -Path $Log -Value $Text -Encoding UTF8 }

Log "=== LocalSunoDb v2.28 known-good recovery ==="
Log ("Date: " + (Get-Date -Format "yyyy-MM-dd HH:mm:ss"))
Log ("Root: " + $Root)

if (-not (Test-Path (Join-Path $Root "LocalSunoDb.py"))) { throw "LocalSunoDb.py nav atrasts." }
if (-not (Test-Path (Join-Path $Root "LS_Elza\__init__.py"))) {
    throw "LS_Elza nav atrasts. Recovery apzināti Elza nepārraksta."
}

$ExpectedScript = (Join-Path $Root "LocalSunoDb.py")
$Processes = Get-CimInstance Win32_Process -ErrorAction SilentlyContinue | Where-Object {
    $_.CommandLine -and
    $_.CommandLine -like ("*" + $ExpectedScript + "*") -and
    $_.ExecutablePath -match '(?i)\\pythonw?\.exe$'
}
foreach ($Proc in $Processes) {
    Log ("Stopping old LS PID " + $Proc.ProcessId + ": " + $Proc.CommandLine)
    Stop-Process -Id ([int]$Proc.ProcessId) -Force -ErrorAction SilentlyContinue
}

for ($i=0; $i -lt 40; $i++) {
    $Listener = Get-NetTCPConnection -LocalPort 8765 -State Listen -ErrorAction SilentlyContinue
    if (-not $Listener) { break }
    Start-Sleep -Milliseconds 250
}
if (Get-NetTCPConnection -LocalPort 8765 -State Listen -ErrorAction SilentlyContinue) {
    throw "Ports 8765 neatbrīvojās."
}

$Py = Get-Command py.exe -ErrorAction SilentlyContinue
$Python = Get-Command python.exe -ErrorAction SilentlyContinue
if ($Py) {
    $PythonExe = $Py.Source
    $Args = @("-3", "LocalSunoDb.py", "--ls-restarted")
} elseif ($Python) {
    $PythonExe = $Python.Source
    $Args = @("LocalSunoDb.py", "--ls-restarted")
} else {
    throw "Python nav atrasts."
}

$Stdout = Join-Path $Root "RECOVER_V228_STDOUT.log"
$Stderr = Join-Path $Root "RECOVER_V228_STDERR.log"
Remove-Item $Stdout,$Stderr -Force -ErrorAction SilentlyContinue

$P = Start-Process -FilePath $PythonExe -ArgumentList $Args -WorkingDirectory $Root -PassThru -RedirectStandardOutput $Stdout -RedirectStandardError $Stderr
Log ("Started PID " + $P.Id)

$Ok = $false
for ($i=0; $i -lt 60; $i++) {
    Start-Sleep -Milliseconds 500
    if ($P.HasExited) { break }
    try {
        $R = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:8765/" -TimeoutSec 2
        if ($R.StatusCode -eq 200 -and $R.Content -match "LS v2\.28") {
            $Ok = $true
            break
        }
    } catch {}
}

if (-not $Ok) {
    Log "RESULT: FAIL"
    if (Test-Path $Stdout) { Get-Content $Stdout | Select-Object -Last 200 | Add-Content $Log -Encoding UTF8 }
    if (Test-Path $Stderr) { Get-Content $Stderr | Select-Object -Last 200 | Add-Content $Log -Encoding UTF8 }
    if (Test-Path (Join-Path $Root "error.log")) { Get-Content (Join-Path $Root "error.log") | Select-Object -Last 200 | Add-Content $Log -Encoding UTF8 }
    throw "LS v2.28 nestartējās. Skatīt RECOVER_V228.log."
}

Log "RESULT: PASS - LS v2.28 HTTP 200"
if (-not $NoBrowser) { Start-Process "http://127.0.0.1:8765/" }
'''

          cmd = r'''@echo off
setlocal
cd /d "%~dp0"
powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%~dp0RECOVER_TO_V228_KNOWN_GOOD.ps1"
set RC=%ERRORLEVEL%
echo.
if "%RC%"=="0" (
  echo Recovery PASS - LS v2.28 darbojas.
) else (
  echo Recovery FAIL - atsuti RECOVER_V228.log.
)
pause
exit /b %RC%
'''

          Path("RECOVER_TO_V228_KNOWN_GOOD.ps1").write_text(ps1, encoding="utf-8-sig")
          Path("RECOVER_TO_V228_KNOWN_GOOD.cmd").write_text(cmd, encoding="utf-8")

          out = Path("LocalSunoDb_v228_KNOWN_GOOD_RECOVERY.zip")
          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for name in names:
                  z.write(name, name)
              z.write("RECOVER_TO_V228_KNOWN_GOOD.ps1")
              z.write("RECOVER_TO_V228_KNOWN_GOOD.cmd")

          with zipfile.ZipFile(out, "r") as z:
              assert z.testzip() is None
              packaged = z.namelist()
              assert not any(name.startswith("LS_Elza/") for name in packaged)
              assert not any(name.startswith(("Data/","Logs/","Backup/","Temp/","Reports/","exports/")) for name in packaged)
          print(f"Packaged {len(names)+2} files")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: LocalSunoDb-v228-KNOWN-GOOD-RECOVERY
          path: LocalSunoDb_v228_KNOWN_GOOD_RECOVERY.zip
          if-no-files-found: error
          retention-days: 7

  windows-exact-overlay:
    needs: package
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/v2291-reconstructed
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: LocalSunoDb-v228-KNOWN-GOOD-RECOVERY
          path: artifact
      - name: Simulate recovery while preserving current Elza
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path ".\app" -Force | Out-Null
          Copy-Item -Recurse -Force ".\LS_Elza" ".\app\LS_Elza"
          Expand-Archive -Path ".\artifact\LocalSunoDb_v228_KNOWN_GOOD_RECOVERY.zip" -DestinationPath ".\app" -Force
          Set-Location ".\app"

          if (-not (Test-Path ".\LS_Elza\__init__.py")) { throw "Preserved LS_Elza missing" }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File ".\RECOVER_TO_V228_KNOWN_GOOD.ps1" -NoBrowser
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $r = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:8765/" -TimeoutSec 5
          if ($r.StatusCode -ne 200 -or $r.Content -notmatch "LS v2\.28") {
            throw "Recovered LS v2.28 page check failed"
          }

          $v = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:8765/app-version" -TimeoutSec 5
          if ($v.StatusCode -ne 200) { throw "app-version endpoint failed" }
