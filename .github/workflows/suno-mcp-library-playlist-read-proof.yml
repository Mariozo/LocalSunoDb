name: Suno MCP Library playlist read proof

on:
  push:
    branches:
      - feat/suno-mcp-library-playlist-read
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Focused read-only tests
        run: |
          python -m pip install pytest
          python -m py_compile ls_suno/mcp_client.py ls_downloader/controller.py
          node --check ls_downloader/static/downloader_suno_mcp_proof_script.js
          python -m pytest -q tests/test_suno_mcp_readonly_proof.py
          git diff --check
      - name: Verify exact runtime delta
        run: |
          python - <<'PY'
          import subprocess
          runtime = {
              name for name in subprocess.check_output(
                  ["git", "diff", "--name-only", "057654d0ec793a71fe41c06b4fe6158729eb7859...HEAD"],
                  text=True,
              ).splitlines()
              if name and not name.startswith(("tests/", ".github/"))
          }
          expected = {
              "ls_suno/mcp_client.py",
              "ls_downloader/controller.py",
              "ls_downloader/templates/connection_section.html",
              "ls_downloader/static/downloader_suno_mcp_proof_script.js",
          }
          assert runtime == expected, (runtime, expected)
          PY
      - name: Build exact delta ZIP
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path

          files = [
              "ls_suno/mcp_client.py",
              "ls_downloader/controller.py",
              "ls_downloader/templates/connection_section.html",
              "ls_downloader/static/downloader_suno_mcp_proof_script.js",
          ]
          out = Path("LocalSunoDb_SUNO_MCP_LIBRARY_PLAYLIST_READ_DELTA.zip")
          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for name in files:
                  archive.write(name, name)
          with zipfile.ZipFile(out, "r") as archive:
              assert archive.namelist() == files
              assert archive.testzip() is None
              assert not any(
                  name.casefold().startswith(
                      ("data/", "logs/", "backup/", "temp/", "reports/")
                  )
                  for name in archive.namelist()
              )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: LocalSunoDb-SUNO-MCP-LIBRARY-PLAYLIST-READ
          path: LocalSunoDb_SUNO_MCP_LIBRARY_PLAYLIST_READ_DELTA.zip
          if-no-files-found: error
          retention-days: 7

  windows-exact-artifact:
    needs: focused-proof
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 057654d0ec793a71fe41c06b4fe6158729eb7859
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: LocalSunoDb-SUNO-MCP-LIBRARY-PLAYLIST-READ
          path: artifact
      - name: Overlay exact ZIP and verify syntax
        shell: pwsh
        run: |
          Expand-Archive -Path ".\artifact\LocalSunoDb_SUNO_MCP_LIBRARY_PLAYLIST_READ_DELTA.zip" -DestinationPath "." -Force
          python -m py_compile ls_suno\mcp_client.py ls_downloader\controller.py
          node --check ls_downloader\static\downloader_suno_mcp_proof_script.js
      - name: Start and verify exact overlaid LS
        shell: pwsh
        run: |
          @'
          import json
          import subprocess
          import sys
          import time
          from urllib.request import urlopen

          out = open("mcp-read-server.log", "w", encoding="utf-8")
          err = open("mcp-read-server.err", "w", encoding="utf-8")
          process = subprocess.Popen(
              [sys.executable, "LocalSunoDb.py", "--ls-restarted"],
              stdout=out,
              stderr=err,
          )
          try:
              for _ in range(160):
                  try:
                      with urlopen("http://127.0.0.1:8765/app-version", timeout=1) as response:
                          if response.status == 200:
                              break
                  except Exception:
                      time.sleep(0.25)
              else:
                  raise AssertionError("LS server did not start")

              with urlopen("http://127.0.0.1:8765/downloader", timeout=5) as response:
                  page = response.read().decode("utf-8", errors="replace")
              assert 'id="suno-mcp-library-btn"' in page
              assert 'id="suno-mcp-playlists-btn"' in page
              assert 'id="suno-mcp-playlist-list"' in page

              with urlopen("http://127.0.0.1:8765/suno-mcp-proof-status?run=0", timeout=5) as response:
                  payload = json.loads(response.read().decode("utf-8"))
              assert payload["ok"] is True
              assert payload["connected"] is False
          finally:
              process.terminate()
              try:
                  process.wait(timeout=10)
              except subprocess.TimeoutExpired:
                  process.kill()
                  process.wait(timeout=5)
              out.close()
              err.close()
          '@ | python -
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: suno-mcp-library-playlist-read-diagnostics
          path: |
            mcp-read-server.log
            mcp-read-server.err
          if-no-files-found: warn
          retention-days: 3
