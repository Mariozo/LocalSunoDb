name: My Library now playing preview

on:
  push:
    branches:
      - feat/my-library-playlist-album-ui

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact changed runtime files
        run: |
          python -m py_compile ls_library/music_browser.py
          python -m pip install pytest
          python -m pytest -q tests/test_local_playlists.py
      - name: Build exact two-file delta
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path
          names = [
              "ls_library/music_browser.py",
              "ls_library/templates/library.html",
          ]
          out = Path("LocalSunoDb_my_library_now_playing_delta.zip")
          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as archive:
              for name in names:
                  archive.write(name, name)
          with zipfile.ZipFile(out, "r") as archive:
              assert archive.namelist() == names
              assert archive.testzip() is None
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: LocalSunoDb-my-library-now-playing-delta
          path: LocalSunoDb_my_library_now_playing_delta.zip
          if-no-files-found: error
          retention-days: 7
