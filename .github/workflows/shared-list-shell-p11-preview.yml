name: Shared list shell P1.1 preview

on:
  push:
    branches:
      - feat/my-library-playlists-list-shell

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify syntax
        shell: bash
        run: |
          python -m py_compile ls_library/music_browser.py ls_library/playlists.py
          node --check ls_web/static/persistent_shell.js
          node --check ls_player/static/suno_global_player_script_assets.js
      - name: Run focused regressions
        shell: bash
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_shared_list_shell.py tests/test_local_playlists.py

  browser-integration:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser test dependency
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Exercise shared shell in a real browser
        run: |
          python - <<'PY'
          import base64
          import json
          import math
          import os
          import struct
          import subprocess
          import sys
          import time
          import urllib.parse
          import urllib.request
          import wave
          from pathlib import Path

          from playwright.sync_api import sync_playwright

          base_url = "http://127.0.0.1:8765"
          music_root = Path("browser_fixture_music") / "[2026] - Shell Artist - Shell Album"
          music_root.mkdir(parents=True, exist_ok=True)

          def write_wav(path, freq):
              rate = 8000
              duration = 0.8
              count = int(rate * duration)
              with wave.open(str(path), "wb") as handle:
                  handle.setnchannels(1)
                  handle.setsampwidth(2)
                  handle.setframerate(rate)
                  frames = bytearray()
                  for i in range(count):
                      value = int(11000 * math.sin(2 * math.pi * freq * i / rate))
                      frames += struct.pack("<h", value)
                  handle.writeframes(bytes(frames))

          write_wav(music_root / "01 - Alpha Shell.wav", 440)
          write_wav(music_root / "02 - Beta Shell.wav", 554)

          # Small valid PNG so the album header also exercises cover rendering.
          cover_png = base64.b64decode(
              "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Y9Zt9sAAAAASUVORK5CYII="
          )
          (music_root / "cover.png").write_bytes(cover_png)

          proc = subprocess.Popen(
              [sys.executable, "LocalSunoDb.py"],
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              text=True,
          )

          def request(path, data=None):
              encoded = None
              headers = {}
              if data is not None:
                  encoded = urllib.parse.urlencode(data).encode("utf-8")
                  headers["Content-Type"] = "application/x-www-form-urlencoded"
              req = urllib.request.Request(base_url + path, data=encoded, headers=headers)
              with urllib.request.urlopen(req, timeout=10) as response:
                  payload = response.read()
                  content_type = response.headers.get("Content-Type", "")
                  if "json" in content_type:
                      return json.loads(payload.decode("utf-8"))
                  return payload.decode("utf-8", errors="replace")

          try:
              deadline = time.time() + 30
              while True:
                  if proc.poll() is not None:
                      out, err = proc.communicate(timeout=2)
                      raise RuntimeError("Backend exited early\nSTDOUT:\n" + out + "\nSTDERR:\n" + err)
                  try:
                      request("/")
                      break
                  except Exception:
                      if time.time() > deadline:
                          raise
                      time.sleep(0.25)

              imported = request(
                  "/music-db-import",
                  {
                      "name": "ShellTest",
                      "root_folder": str(music_root.resolve()),
                      "default_genre": "BrowserTest",
                  },
              )
              assert imported.get("ok"), imported
              assert int(imported.get("track_count") or 0) >= 2, imported

              playlist = request("/playlist-create", {"name": "Shell Playlist"})
              assert playlist.get("ok"), playlist
              playlist_id = str((playlist.get("playlist") or {}).get("id") or "")
              assert playlist_id

              with sync_playwright() as pw:
                  browser = pw.chromium.launch(
                      headless=True,
                      args=["--autoplay-policy=no-user-gesture-required"],
                  )
                  page = browser.new_page(viewport={"width": 1600, "height": 1000})
                  page.goto(base_url + "/", wait_until="domcontentloaded")
                  page.wait_for_selector("body#ls-library")
                  # CI starts as a fresh install; the product modal is unrelated
                  # to this shell/player integration test.
                  page.evaluate("document.getElementById('fresh-install-modal')?.remove()")

                  page.evaluate(
                      "window.LSShellNavigate('/my-library?db=ShellTest&view=list')"
                  )
                  page.wait_for_function(
                      "() => !!document.querySelector('#ls-shell-screen-host iframe.is-active')"
                  )
                  host_z = page.eval_on_selector(
                      "#ls-shell-screen-host", "el => getComputedStyle(el).zIndex"
                  )
                  assert host_z == "1260", host_z

                  iframe = page.query_selector("#ls-shell-screen-host iframe.is-active")
                  assert iframe
                  frame = iframe.content_frame()
                  assert frame
                  frame.wait_for_selector(".music-track-row")
                  frame.wait_for_function(
                      "() => document.documentElement.classList.contains('ls-shell-embedded')"
                  )

                  old_display = frame.eval_on_selector(
                      "#my-music-player", "el => getComputedStyle(el).display"
                  )
                  assert old_display == "none", old_display

                  rows = frame.locator(".music-track-row")
                  assert rows.count() >= 2
                  first_title = rows.nth(0).get_attribute("data-player-title")
                  second_title = rows.nth(1).get_attribute("data-player-title")
                  assert first_title and second_title and first_title != second_title

                  rows.nth(0).locator(".music-row-play").click()
                  page.wait_for_function(
                      "(title) => document.querySelector('#ls-global-player-title')?.textContent.trim() === title",
                      first_title,
                  )
                  page.wait_for_function(
                      "(title) => document.querySelector('#selected-track-panel-title')?.textContent.trim() === title",
                      first_title,
                  )

                  old_audio = frame.eval_on_selector(
                      "#my-player-audio",
                      "el => ({src: el.getAttribute('src') || '', paused: el.paused})",
                  )
                  assert old_audio["src"] == "", old_audio
                  assert old_audio["paused"] is True, old_audio

                  parent_audio = page.eval_on_selector(
                      "#ls-global-player .ls-global-player-audio",
                      "el => ({src: el.getAttribute('src') || '', paused: el.paused})",
                  )
                  assert "/local-audio?path=" in parent_audio["src"], parent_audio
                  assert page.locator("#selected-track-panel").evaluate(
                      "el => el.classList.contains('is-external-track')"
                  )

                  page.locator("#ls-global-player-next").click()
                  page.wait_for_function(
                      "(title) => document.querySelector('#ls-global-player-title')?.textContent.trim() === title",
                      second_title,
                  )
                  page.wait_for_function(
                      "(title) => document.querySelector('#selected-track-panel-title')?.textContent.trim() === title",
                      second_title,
                  )

                  # My Library album header is real and lives above the list.
                  page.evaluate("window.LSShellNavigate('/my-library?db=ShellTest')")
                  page.wait_for_timeout(250)
                  iframe = page.query_selector("#ls-shell-screen-host iframe.is-active")
                  frame = iframe.content_frame()
                  frame.wait_for_selector(".album-card")
                  album_href = frame.locator(".album-card").first.get_attribute("href")
                  assert album_href and "album=" in album_href, album_href
                  page.evaluate("(url) => window.LSShellNavigate(url)", album_href)
                  page.wait_for_timeout(250)
                  iframe = page.query_selector("#ls-shell-screen-host iframe.is-active")
                  frame = iframe.content_frame()
                  frame.wait_for_selector(".album-hero-v2")
                  hero_title = frame.locator(".album-hero-copy-v2 h1").text_content().strip()
                  assert hero_title == "Shell Album", hero_title
                  assert frame.locator("#album-hero-cover").count() == 1

                  # The secondary frame must cover the old Suno filter dock at the top.
                  host_box = page.locator("#ls-shell-screen-host").bounding_box()
                  assert host_box
                  top_element = page.evaluate(
                      "([x,y]) => { const el = document.elementFromPoint(x,y); return {tag:el?.tagName||'', cls:String(el?.className||'')}; }",
                      [host_box["x"] + 50, host_box["y"] + 40],
                  )
                  assert top_element["tag"] == "IFRAME", top_element
                  assert "ls-shell-screen-frame" in top_element["cls"], top_element

                  # Playlist header is also above the list and no longer behind Suno filters.
                  playlist_url = "/playlists?id=" + urllib.parse.quote(playlist_id)
                  page.evaluate("(url) => window.LSShellNavigate(url)", playlist_url)
                  page.wait_for_timeout(250)
                  iframe = page.query_selector("#ls-shell-screen-host iframe.is-active")
                  frame = iframe.content_frame()
                  frame.wait_for_selector(".playlist-hero")
                  assert frame.locator("#playlist-title").text_content().strip() == "Shell Playlist"

                  browser.close()
          finally:
              proc.terminate()
              try:
                  proc.wait(timeout=5)
              except subprocess.TimeoutExpired:
                  proc.kill()
                  proc.wait(timeout=5)
          PY

  build:
    needs: browser-integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build full code-only preview
        run: |
          python - <<'PY'
          import subprocess, zipfile
          from pathlib import Path

          include_roots = (
              "LS_Elza/",
              "LS_Suno_TokenBridge/",
              "ls_audio/",
              "ls_core/",
              "ls_data/",
              "ls_downloader/",
              "ls_library/",
              "ls_media/",
              "ls_player/",
              "ls_stems/",
              "ls_suno/",
              "ls_tools/",
              "ls_upgrade/",
              "ls_web/",
          )
          include_files = {
              "LocalSunoDb.py",
              "Start_LocalSunoDb.cmd",
              "RESTART_BACKEND.cmd",
              "INSTALL_v1.16_backend.cmd",
          }
          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          names = [
              name for name in tracked
              if name in include_files or name.startswith(include_roots)
          ]
          forbidden = ("Data/", "Logs/", "Backup/", "Temp/", "Reports/", "exports/")
          assert not any(name.startswith(forbidden) for name in names)

          out = Path("LocalSunoDb_v2291_LIST_SHELL_P11.zip")
          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for name in names:
                  archive.write(name, name)
          with zipfile.ZipFile(out, "r") as archive:
              assert archive.testzip() is None
          print(f"Packaged {len(names)} code files")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: LocalSunoDb-v2291-LIST-SHELL-P11
          path: LocalSunoDb_v2291_LIST_SHELL_P11.zip
          if-no-files-found: error
          retention-days: 7

  windows-artifact-smoke:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: LocalSunoDb-v2291-LIST-SHELL-P11
          path: artifact
      - name: Test exact ZIP
        shell: pwsh
        run: |
          Expand-Archive -Path ".\artifact\LocalSunoDb_v2291_LIST_SHELL_P11.zip" -DestinationPath ".\app" -Force
          Set-Location ".\app"
          python .\LocalSunoDb.py --ls-update-probe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $stdout = Join-Path $PWD "runtime.stdout.log"
          $stderr = Join-Path $PWD "runtime.stderr.log"
          $p = Start-Process -FilePath "python" -ArgumentList ".\LocalSunoDb.py" -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $ok = $false
          for ($i = 0; $i -lt 50; $i++) {
            Start-Sleep -Milliseconds 400
            if ($p.HasExited) { break }
            try {
              $root = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:8765/" -TimeoutSec 2
              if ($root.StatusCode -eq 200) { $ok = $true; break }
            } catch {}
          }
          if (-not $ok) {
            if (Test-Path $stdout) { Get-Content $stdout }
            if (Test-Path $stderr) { Get-Content $stderr }
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
            throw "Exact artifact did not start on port 8765"
          }
          $root = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:8765/" -TimeoutSec 5
          if ($root.Content -match 'id="ls-sidebar-stems-btn"') { throw "Sidebar Stems still present" }
          if ($root.Content -notmatch 'LS v2\.29\.1') { throw "v2.29.1 identity missing" }
          Stop-Process -Id $p.Id -Force
