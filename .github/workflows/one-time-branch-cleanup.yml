name: One-time branch cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: contains(github.event.head_commit.message, '[branch-cleanup-run]')
    runs-on: ubuntu-latest
    steps:
      - name: Delete obsolete LocalSunoDb branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          branches=(
            "feature/local-playlists-v1"
            "fix/v2.0-gitignore-root-tools"
            "fix/v215-playlist-add-action-visible"
            "fix/v216-cover-selection-final"
            "fix/v216-playlist-selection-flow"
            "fix/v216-select-wav-playlist-flow"
            "fix/v217-single-playlist-action-slot"
            "fix/v218-select-audio-playlist-dropdown"
            "package/v2.02-backend-restart"
            "package/v2.03-backend-restart"
            "package/v2.04-animated-play"
            "package/v2.06-playlist-add-selected"
            "package/v2.08-playlist-player"
            "package/v2.09-saved-views"
            "package/v2.10-playlist-native-add"
            "package/v2.11-help-root-hygiene"
            "release/v2.15-artifact"
            "release/v2.15"
            "revert/pr17-restore-browser-tab"
            "task/animated-play-button-v2.04"
            "task/backend-restart-loop-v2.03"
            "task/backend-restart-without-windows"
            "task/build-v213-overlay"
            "task/build-v214-playlist-overlay"
            "task/build-v215-playlist-fix"
            "task/build-v216-final-zip"
            "task/build-v216-overlay"
            "task/build-v217-playlist-action-zip"
            "task/build-v218-select-audio-zip"
            "task/build-v219-browser-verified-zip"
            "task/five-bar-play-indicator-v2.08"
            "task/fix-popup-text-contrast"
            "task/help-root-hygiene-v2.11"
            "task/local-playlists-v1"
            "task/local-suno-db-rebuild"
            "task/local-suno-runtime-db-switch"
            "task/playlist-add-mode-v2.07"
            "task/playlist-add-selected-v2.06"
            "task/playlist-local-select-wav-flow"
            "task/playlist-native-add-v2.10"
            "task/pwa-backend-lifecycle"
            "task/remove-dead-rows-ui"
            "task/remove-orphaned-architecture-manifest"
            "task/restore-old-play-button-v2.05"
            "task/restore-sf-operating-model"
            "task/restore-standalone-chrome-app"
            "task/saved-views-constants-v2.09"
            "task/v2.12-popup-theme-refresh"
            "task/v2.13-popup-theme-load-order"
            "task/version-v2.02"
            "test/popup-theme-contract"
          )

          for branch in "${branches[@]}"; do
            if [[ "$branch" == "main" || "$branch" == "fix/v219-browser-verified-select-audio" ]]; then
              echo "Refusing to delete protected working branch: $branch" >&2
              exit 1
            fi

            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" >/dev/null 2>&1; then
              echo "Deleting $branch"
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
            else
              echo "Already absent: $branch"
            fi
          done
