name: Local Suno DB migration

on:
  pull_request:
    branches: [main]
    paths:
      - 'ls_data/local_suno_migration.py'
      - 'ls_data/local_suno_runtime.py'
      - 'ls_data/database_context.py'
      - 'ls_data/repository.py'
      - 'ls_core/runtime.py'
      - 'ls_web/app.py'
      - 'ls_web/render.py'
      - 'ls_web/elza_adapter.py'
      - 'ls_web/elza_selection_bridge.py'
      - 'LS_Elza/selection_intent.py'
      - 'LS_Elza/service.py'
      - 'LS_Elza/ui.py'
      - 'ls_web/static/popup_theme.css'
      - 'ls_library/templates/library.html'
      - 'ls_library/static/suno_selection_state_script.js'
      - 'ls_library/static/suno_selection_actions_script.js'
      - 'ls_library/static/suno_page_suno_library_list_style_assets.css'
      - 'ls_library/static/suno_filter_layout_dock_style_assets.css'
      - 'ls_library/playlists.py'
      - 'ls_library/render.py'
      - 'LocalSunoDb.py'
      - 'Start_LocalSunoDb.cmd'
      - 'ls_tools/launcher.py'
      - 'tests/test_backend_restart.py'
      - 'tests/test_popup_theme_contract.py'
      - 'tests/test_local_playlists.py'
      - 'tests/test_elza_selection_regression.py'
      - 'tests/test_local_suno_migration.py'
      - 'tests/test_local_suno_runtime.py'
      - 'tests/test_database_context.py'
      - '.github/workflows/local-suno-db-migration.yml'

permissions:
  contents: read

jobs:
  migration-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: Verify v2.19 changed-file syntax and line endings
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import py_compile

          py_compile.compile("LocalSunoDb.py", doraise=True)
          py_compile.compile("ls_core/runtime.py", doraise=True)
          py_compile.compile("ls_data/database_context.py", doraise=True)
          py_compile.compile("ls_data/repository.py", doraise=True)
          py_compile.compile("ls_web/app.py", doraise=True)
          py_compile.compile("ls_library/playlists.py", doraise=True)
          py_compile.compile("ls_library/render.py", doraise=True)

          for name in (
              "LocalSunoDb.py",
              "ls_core/runtime.py",
              "ls_library/playlists.py",
              "ls_library/render.py",
              "ls_library/templates/library.html",
              "ls_library/static/suno_selection_state_script.js",
              "ls_library/static/suno_selection_actions_script.js",
              "ls_library/static/suno_page_suno_library_list_style_assets.css",
              "ls_library/static/suno_filter_layout_dock_style_assets.css",
              "tests/test_local_playlists.py",
          ):
              data = Path(name).read_bytes()
              crlf = data.count(b"\r\n")
              lf = data.count(b"\n")
              bare_lf = lf - crlf
              if crlf and bare_lf:
                  raise SystemExit(f"Mixed line endings: {name}")
          '@ | python -
          node --check ls_library/static/suno_selection_state_script.js
          node --check ls_library/static/suno_selection_actions_script.js
          @'
          from pathlib import Path
          from ls_library.playlists import render_playlist_library_actions_script

          rendered = render_playlist_library_actions_script().strip()
          body = rendered[len("<script>"):]
          body = body.rsplit("</script>", 1)[0]
          Path("playlist_actions_v219.js").write_text(body, encoding="utf-8", newline="\n")
          '@ | python -
          node --check playlist_actions_v219.js
          git diff --check HEAD^1 HEAD
      - run: python -m pytest -q tests/test_database_context.py tests/test_local_suno_migration.py tests/test_local_suno_runtime.py tests/test_backend_restart.py tests/test_popup_theme_contract.py tests/test_local_playlists.py tests/test_elza_selection_regression.py
  package-elza-v241:
    needs: migration-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: Re-run Elza v2.41 controller regression
        run: python -m pytest -q tests/test_elza_selection_regression.py
      - name: Build and verify exact Elza v2.41 overlay ZIP
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          files = (
              "LS_Elza/selection_intent.py",
              "LS_Elza/selection_guard.py",
              "LS_Elza/locf_intent.py",
              "LS_Elza/ls_adapter/runtime_bridge.py",
              "LS_Elza/__init__.py",
              "LS_Elza/v230_ui_enhancer.py",
              "LS_Elza/ui.py",
              "ls_web/elza_selection_bridge.py",
              "ls_web/elza_adapter.py",
              "ls_web/elza_controller.py",
          )

          archive_path = Path("Elza-v2.41.zip")
          with ZipFile(archive_path, "w", ZIP_DEFLATED) as archive:
              for name in files:
                  archive.write(name, name)

          verify_root = Path("_zip_verify")
          with ZipFile(archive_path, "r") as archive:
              assert tuple(archive.namelist()) == files
              archive.testzip() is None
              archive.extractall(verify_root)

          for name in files:
              source = Path(name).read_bytes()
              extracted = (verify_root / name).read_bytes()
              assert extracted == source, name
              extracted.decode("utf-8")
              compile(extracted, name, "exec")

          init_text = (verify_root / "LS_Elza/__init__.py").read_text(encoding="utf-8")
          enhancer_text = (verify_root / "LS_Elza/v230_ui_enhancer.py").read_text(encoding="utf-8")
          controller_text = (verify_root / "ls_web/elza_controller.py").read_text(encoding="utf-8")
          assert 'LS_ELZA_PACKAGE_VERSION = "2.41"' in init_text
          assert "Elza v2.41" in enhancer_text
          assert "get_selection_result=get_ls_elza_selection_result" in controller_text
          assert "build_ls_elza_selection_answer" in controller_text
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Elza-v2.41-final
          path: Elza-v2.41.zip
          if-no-files-found: error
