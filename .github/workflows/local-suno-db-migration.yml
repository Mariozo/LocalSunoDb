name: Local Suno DB migration

on:
  pull_request:
    branches: [main]
    paths:
      - 'ls_data/local_suno_migration.py'
      - 'tests/test_local_suno_migration.py'
      - '.github/workflows/local-suno-db-migration.yml'

permissions:
  contents: read

jobs:
  migration-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_local_suno_migration.py
