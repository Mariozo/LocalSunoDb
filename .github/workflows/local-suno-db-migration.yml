name: Local Suno DB migration

on:
  pull_request:
    branches: [main]
    paths:
      - 'ls_data/local_suno_migration.py'
      - 'ls_data/local_suno_runtime.py'
      - 'ls_data/repository.py'
      - 'ls_core/runtime.py'
      - 'ls_web/app.py'
      - 'ls_web/render.py'
      - 'ls_web/elza_adapter.py'
      - 'ls_web/elza_selection_bridge.py'
      - 'LS_Elza/selection_intent.py'
      - 'LS_Elza/service.py'
      - 'ls_web/static/popup_theme.css'
      - 'ls_library/templates/library.html'
      - 'ls_library/playlists.py'
      - 'ls_library/render.py'
      - 'ls_library/static/suno_selection_state_script.js'
      - 'ls_library/static/suno_selection_actions_script.js'
      - 'ls_library/static/suno_page_suno_library_list_style_assets.css'
      - 'ls_library/static/suno_filter_layout_dock_style_assets.css'
      - 'LocalSunoDb.py'
      - 'Start_LocalSunoDb.cmd'
      - 'ls_tools/launcher.py'
      - 'tests/test_backend_restart.py'
      - 'tests/test_popup_theme_contract.py'
      - 'tests/test_local_playlists.py'
      - 'tests/test_elza_selection_regression.py'
      - 'tests/test_local_suno_migration.py'
      - 'tests/test_local_suno_runtime.py'
      - '.github/workflows/local-suno-db-migration.yml'

permissions:
  contents: read

jobs:
  migration-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m py_compile LocalSunoDb.py ls_core/runtime.py ls_library/playlists.py ls_library/render.py
      - run: node --check ls_library/static/suno_selection_state_script.js
      - run: node --check ls_library/static/suno_selection_actions_script.js
      - run: python -c "from pathlib import Path; from ls_library.playlists import render_playlist_library_actions_script as f; s=f().strip(); Path('playlist_actions_check.js').write_text(s.removeprefix('<script>').removesuffix('</script>'), encoding='utf-8')"
      - run: node --check playlist_actions_check.js
      - run: git diff --check HEAD^ HEAD
      - run: python -m pytest -q tests/test_local_suno_migration.py tests/test_local_suno_runtime.py tests/test_backend_restart.py tests/test_popup_theme_contract.py tests/test_local_playlists.py tests/test_elza_selection_regression.py
