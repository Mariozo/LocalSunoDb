name: Runtime port smoke

on:
  push:
    branches:
      - refactor/ls-shell-my-library-selection

jobs:
  windows-runtime:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe imports
        shell: pwsh
        run: |
          python .\LocalSunoDb.py --ls-update-probe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Start backend and verify port
        shell: pwsh
        run: |
          $stdout = Join-Path $PWD "runtime.stdout.log"
          $stderr = Join-Path $PWD "runtime.stderr.log"
          $p = Start-Process -FilePath "python" -ArgumentList ".\LocalSunoDb.py" -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $ok = $false
          for ($i = 0; $i -lt 40; $i++) {
            Start-Sleep -Milliseconds 500
            if ($p.HasExited) { break }
            try {
              $r = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:8765/" -TimeoutSec 2
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch {}
          }
          Write-Host "--- STDOUT ---"
          if (Test-Path $stdout) { Get-Content $stdout }
          Write-Host "--- STDERR ---"
          if (Test-Path $stderr) { Get-Content $stderr }
          if (-not $ok) {
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
            throw "LocalSunoDb did not become reachable on 127.0.0.1:8765"
          }
          Stop-Process -Id $p.Id -Force
