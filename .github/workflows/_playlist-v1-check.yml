name: Playlist v1 branch check

on:
  push:
    branches:
      - task/local-playlists-v1

permissions:
  contents: read

jobs:
  playlist-v1:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_local_playlists.py
      - run: python LocalSunoDb.py --ls-update-probe
