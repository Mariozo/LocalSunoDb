name: Shared shell stage 1.2 preview

on:
  push:
    branches:
      - refactor/ls-shell-my-library-selection

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify syntax
        shell: bash
        run: |
          python -m py_compile             ls_library/music_browser.py             ls_library/playlists.py             ls_web/handler.py             ls_web/pages.py             ls_data/music_library.py
          node --check ls_web/static/persistent_shell.js
          node --check ls_library/static/my_library_shared_view.js
          node --check ls_player/static/suno_global_player_script_assets.js
      - name: Run focused tests
        shell: bash
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_shared_my_library_shell.py tests/test_local_playlists.py

  artifact:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build UI reset plus stage 1.2 overlay
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path

          names = [
              "ls_data/music_library.py",
              "ls_library/music_browser.py",
              "ls_library/playlists.py",
              "ls_library/static/my_library_shared_view.css",
              "ls_library/static/my_library_shared_view.js",
              "ls_library/static/suno_page_selected_track_shell_style_assets.css",
              "ls_library/templates/library.html",
              "ls_player/static/suno_global_player_script_assets.js",
              "ls_web/handler.py",
              "ls_web/pages.py",
              "ls_web/static/persistent_shell.css",
              "ls_web/static/persistent_shell.js",
          ]
          out = Path("LocalSunoDb_ui_reset_stage12_preview.zip")
          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as archive:
              for name in names:
                  archive.write(name, name)
          with zipfile.ZipFile(out, "r") as archive:
              assert archive.namelist() == names
              assert archive.testzip() is None
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: LocalSunoDb-ui-reset-stage12-preview
          path: LocalSunoDb_ui_reset_stage12_preview.zip
          if-no-files-found: error
          retention-days: 7
