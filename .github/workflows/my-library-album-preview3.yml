name: My Library album preview 3

on:
  push:
    branches:
      - feat/my-library-spotify-album-ui

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact runtime file
        run: |
          python -m py_compile ls_library/music_browser.py
          python -m pip install pytest
          python -m pytest -q tests/test_local_playlists.py
      - name: Build exact one-file overlay
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path
          names = ["ls_library/music_browser.py"]
          out = Path("LocalSunoDb_my_library_spotify_album_preview3.zip")
          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as archive:
              for name in names:
                  archive.write(name, name)
          with zipfile.ZipFile(out, "r") as archive:
              assert archive.namelist() == names
              assert archive.testzip() is None
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: LocalSunoDb-my-library-spotify-album-preview3
          path: LocalSunoDb_my_library_spotify_album_preview3.zip
          if-no-files-found: error
          retention-days: 7
