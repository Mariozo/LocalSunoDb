name: Emergency v2.29 code recovery

on:
  push:
    branches:
      - recovery/v229-code-only

jobs:
  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify startup probe
        shell: pwsh
        run: |
          python .\LocalSunoDb.py --ls-update-probe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Start backend and verify port 8765
        shell: pwsh
        run: |
          $stdout = Join-Path $PWD "runtime.stdout.log"
          $stderr = Join-Path $PWD "runtime.stderr.log"
          $p = Start-Process -FilePath "python" -ArgumentList ".\LocalSunoDb.py" -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $ok = $false
          for ($i = 0; $i -lt 40; $i++) {
            Start-Sleep -Milliseconds 500
            if ($p.HasExited) { break }
            try {
              $r = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:8765/" -TimeoutSec 2
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch {}
          }
          Write-Host "--- STDOUT ---"
          if (Test-Path $stdout) { Get-Content $stdout }
          Write-Host "--- STDERR ---"
          if (Test-Path $stderr) { Get-Content $stderr }
          if (-not $ok) {
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
            throw "Recovery baseline did not become reachable on 127.0.0.1:8765"
          }
          Stop-Process -Id $p.Id -Force

  artifact:
    needs: windows-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build code-only recovery ZIP
        run: |
          python - <<'PY'
          import subprocess, zipfile
          from pathlib import Path

          include_roots = (
              "LS_Elza/",
              "LS_Suno_TokenBridge/",
              "ls_audio/",
              "ls_core/",
              "ls_data/",
              "ls_downloader/",
              "ls_library/",
              "ls_media/",
              "ls_player/",
              "ls_stems/",
              "ls_suno/",
              "ls_tools/",
              "ls_upgrade/",
              "ls_web/",
          )
          include_files = {
              "LocalSunoDb.py",
              "Start_LocalSunoDb.cmd",
              "RESTART_BACKEND.cmd",
          }

          tracked = subprocess.check_output(
              ["git", "ls-files"], text=True
          ).splitlines()
          names = [
              name for name in tracked
              if name in include_files or name.startswith(include_roots)
          ]

          forbidden = (
              "Data/", "Logs/", "Backup/", "Temp/",
              "Reports/", "exports/"
          )
          assert not any(name.startswith(forbidden) for name in names)
          assert "LocalSunoDb.py" in names
          assert "Start_LocalSunoDb.cmd" in names
          assert any(name.startswith("ls_web/") for name in names)

          out = Path("LocalSunoDb_v229_CODE_RECOVERY.zip")
          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for name in names:
                  archive.write(name, name)

          with zipfile.ZipFile(out, "r") as archive:
              assert archive.testzip() is None
              assert "Data/local_suno.db" not in archive.namelist()

          print(f"Packaged {len(names)} code files")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: LocalSunoDb-v229-CODE-RECOVERY
          path: LocalSunoDb_v229_CODE_RECOVERY.zip
          if-no-files-found: error
          retention-days: 7
