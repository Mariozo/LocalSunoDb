name: Direct canonical Library known-good

on:
  pull_request:
    branches:
      - baseline/direct-canonical-library-known-good

jobs:
  library-render:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Compile affected modules
        run: python -m compileall -q ls_core ls_data ls_library ls_web
      - name: Run canonical Library tests
        run: python -m pytest -q tests/test_direct_canonical_library.py
