name: Five-bar player v2.08 check

on:
  push:
    branches:
      - task/five-bar-play-indicator-v2.08

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -c "from ls_core.runtime import APP_VERSION, APP_BASED_ON; assert APP_VERSION == 'v2.08'; assert APP_BASED_ON == 'v2.07'"
      - name: Check five-bar playback semantics
        shell: pwsh
        run: |
          $css = Get-Content -Raw "ls_library/static/suno_page_suno_library_list_style_assets.css"
          if (-not $css.Contains("ls-library-five-bars")) { throw "missing five-bar keyframes" }
          if (-not $css.Contains("player-open .ls-cover-play-btn::after")) { throw "missing paused static bars" }
          if (-not $css.Contains("player-open .ls-cover-play-btn.active::after")) { throw "missing playing animation binding" }
          $barCount = ([regex]::Matches($css, "linear-gradient\(#FFFFFF, #FFFFFF\)")).Count
          if ($barCount -lt 5) { throw "expected five playback bars" }
      - run: python -m pytest -q tests/test_local_playlists.py tests/test_backend_restart.py tests/test_local_suno_runtime.py tests/test_local_suno_migration.py
      - run: python LocalSunoDb.py --ls-update-probe
