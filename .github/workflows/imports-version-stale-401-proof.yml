name: Imports version stale 401 proof

on:
  push:
    branches:
      - fix/imports-version-stale-401
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Focused tests
        run: |
          python -m pip install pytest
          node --check ls_downloader/static/downloader_state_script.js
          python -m pytest -q tests/test_imports_version_stale_401.py
          git diff --check
      - name: Verify stale 401 helper behavior
        run: |
          node <<'NODE'
          const fs = require("fs");
          const src = fs.readFileSync("ls_downloader/static/downloader_state_script.js", "utf8");
          const match = src.match(/function isHistoricalExpiredSunoTokenStatus\(statusText\) \{[\s\S]*?\n        \}/);
          if (!match) throw new Error("helper not found");
          eval(match[0]);
          const yes = [
            "Importa kļūda: Suno API HTTP 401: token is expired or invalid. Use Renew Suno login in LS.",
            "Suno API HTTP 401: token is invalid",
            "Suno API HTTP 401: Renew Suno login"
          ];
          const no = [
            "Importa kļūda: HTTP 401: permission denied",
            "Suno API HTTP 403: token is expired",
            "Importa kļūda: tīkla kļūda"
          ];
          for (const value of yes) {
            if (!isHistoricalExpiredSunoTokenStatus(value)) throw new Error("expected stale auth status: " + value);
          }
          for (const value of no) {
            if (isHistoricalExpiredSunoTokenStatus(value)) throw new Error("unexpected suppression: " + value);
          }
          NODE
      - name: Verify exact runtime delta
        run: |
          python - <<'PY'
          import subprocess
          runtime = {
              name for name in subprocess.check_output(
                  ["git", "diff", "--name-only", "741aac20bdcdd8b8f091518b04ecf6cc679698b7...HEAD"],
                  text=True,
              ).splitlines()
              if name and not name.startswith(("tests/", ".github/"))
          }
          expected = {
              "ls_downloader/templates/downloader.html",
              "ls_downloader/static/downloader_state_script.js",
          }
          assert runtime == expected, (runtime, expected)
          PY
      - name: Build exact delta ZIP
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path
          files = [
              "ls_downloader/templates/downloader.html",
              "ls_downloader/static/downloader_state_script.js",
          ]
          out = Path("LocalSunoDb_IMPORTS_VERSION_STALE_401_FIX.zip")
          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for name in files:
                  archive.write(name, name)
          with zipfile.ZipFile(out, "r") as archive:
              assert archive.namelist() == files
              assert archive.testzip() is None
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: LocalSunoDb-IMPORTS-VERSION-STALE-401-FIX
          path: LocalSunoDb_IMPORTS_VERSION_STALE_401_FIX.zip
          if-no-files-found: error
          retention-days: 7

  windows-exact-artifact:
    needs: focused-proof
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 741aac20bdcdd8b8f091518b04ecf6cc679698b7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: LocalSunoDb-IMPORTS-VERSION-STALE-401-FIX
          path: artifact
      - name: Overlay exact ZIP and verify syntax
        shell: pwsh
        run: |
          Expand-Archive -Path ".\artifact\LocalSunoDb_IMPORTS_VERSION_STALE_401_FIX.zip" -DestinationPath "." -Force
          node --check ls_downloader\static\downloader_state_script.js
      - name: Start and verify exact overlaid LS
        shell: pwsh
        run: |
          @'
          import subprocess
          import sys
          import time
          from urllib.request import urlopen

          out = open("imports-fix-server.log", "w", encoding="utf-8")
          err = open("imports-fix-server.err", "w", encoding="utf-8")
          process = subprocess.Popen(
              [sys.executable, "LocalSunoDb.py", "--ls-restarted"],
              stdout=out,
              stderr=err,
          )
          try:
              for _ in range(160):
                  try:
                      with urlopen("http://127.0.0.1:8765/app-version", timeout=1) as response:
                          if response.status == 200:
                              break
                  except Exception:
                      time.sleep(0.25)
              else:
                  raise AssertionError("LS server did not start")

              with urlopen("http://127.0.0.1:8765/downloader", timeout=5) as response:
                  page = response.read().decode("utf-8", errors="replace")
              assert '<h1>Imports <span class="muted">· LS ' in page
              assert "@@LS0@@" not in page

              with urlopen("http://127.0.0.1:8765/ls-static/ls_downloader/static/downloader_state_script.js", timeout=5) as response:
                  script = response.read().decode("utf-8", errors="replace")
              assert "isHistoricalExpiredSunoTokenStatus" in script
              assert 'status_text: staleAuthStatus ? "" : statusText' in script
          finally:
              process.terminate()
              try:
                  process.wait(timeout=10)
              except subprocess.TimeoutExpired:
                  process.kill()
                  process.wait(timeout=5)
              out.close()
              err.close()
          '@ | python -
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: imports-version-stale-401-diagnostics
          path: |
            imports-fix-server.log
            imports-fix-server.err
          if-no-files-found: warn
          retention-days: 3
