name: Build v2.17 Playlist action ZIP

on:
  pull_request:
    branches: [main]

jobs:
  build-v217:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build exact v2.17 ZIP
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import zipfile

          files = [
              Path("LocalSunoDb.py"),
              Path("ls_core/runtime.py"),
              Path("ls_library/playlists.py"),
              Path("ls_library/templates/library.html"),
              Path("ls_library/static/suno_filter_layout_dock_style_assets.css"),
          ]
          out = Path("LocalSunoDb_v2.17.zip")
          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as archive:
              for path in files:
                  if not path.is_file():
                      raise SystemExit(f"Missing file: {path}")
                  archive.write(path, path.as_posix())
          with zipfile.ZipFile(out) as archive:
              assert archive.namelist() == [p.as_posix() for p in files]
          '@ | python -
      - name: Verify ZIP contract
        shell: pwsh
        run: |
          @'
          import zipfile
          with zipfile.ZipFile("LocalSunoDb_v2.17.zip") as z:
              data={n:z.read(n) for n in z.namelist()}
          entry=data["LocalSunoDb.py"].decode()
          runtime=data["ls_core/runtime.py"].decode()
          playlists=data["ls_library/playlists.py"].decode()
          template=data["ls_library/templates/library.html"].decode()
          css=data["ls_library/static/suno_filter_layout_dock_style_assets.css"].decode()
          assert '# Based on: v2.16' in entry
          assert 'APP_VERSION = "v2.17"' in entry
          assert 'APP_BASED_ON = "v2.16"' in entry
          assert 'APP_VERSION = "v2.17"' in runtime
          assert 'APP_BASED_ON = "v2.16"' in runtime
          assert 'id="add-selected-playlist-btn"' in template
          assert '>Select Audio</button>' in template
          assert 'id="audio-selection-label"' not in template
          assert 'id="compare-this-btn"' not in template
          assert 'style="display:none;" disabled title="Add songs to Playlist"' not in template
          assert 'selectedButton.textContent = "Select Audio"' in playlists
          assert '"+ Add song (1)"' in playlists
          assert '"+ Add songs (" + count + ")"' in playlists
          assert 'selectedButton.title = "Add songs to Playlist"' in playlists
          assert 'selectedButton.style.display' not in playlists
          assert 'String(playlist.name || "Playlist") + " (" + count + ")"' in playlists
          assert '#add-selected-playlist-btn' in css
          for name,b in data.items():
              crlf=b.count(b"\r\n"); lf=b.count(b"\n"); bare=lf-crlf
              if crlf and bare:
                  raise SystemExit(f"Mixed line endings: {name}")
          '@ | python -
      - name: Apply ZIP over v2.16 baseline
        shell: pwsh
        run: |
          git worktree add baseline-v216 8e385ac6dd558c451036aeb1e7abdbbc45ad230e
          Expand-Archive -Path LocalSunoDb_v2.17.zip -DestinationPath baseline-v216 -Force
      - name: Verify exact overlaid artifact
        shell: pwsh
        run: |
          python -m py_compile baseline-v216/LocalSunoDb.py baseline-v216/ls_core/runtime.py baseline-v216/ls_library/playlists.py
          @'
          from pathlib import Path
          import sys
          root=Path("baseline-v216").resolve()
          sys.path.insert(0,str(root))
          from ls_library.playlists import render_playlist_library_actions_script
          s=render_playlist_library_actions_script().strip()
          body=s[len("<script>"):].rsplit("</script>",1)[0]
          Path("playlist_actions_v217_exact.js").write_text(body,encoding="utf-8",newline="\n")
          '@ | python -
          node --check playlist_actions_v217_exact.js
      - name: Run startup probe and Playlist regressions
        shell: pwsh
        run: |
          $output = python baseline-v216/LocalSunoDb.py --ls-update-probe
          $output | Write-Host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not ($output -match 'LS_UPDATE_PROBE_OK')) { throw 'Missing probe marker' }
          if (-not ($output -match '"app_version": "v2.17"')) { throw 'Probe is not v2.17' }
          python -m pip install pytest
          Copy-Item tests/test_local_playlists.py baseline-v216/tests/test_local_playlists.py -Force
          Push-Location baseline-v216
          python -m pytest -q tests/test_local_playlists.py
          Pop-Location
      - uses: actions/upload-artifact@v4
        with:
          name: LocalSunoDb-v2.17-playlist-action
          path: LocalSunoDb_v2.17.zip
          if-no-files-found: error
          retention-days: 2
