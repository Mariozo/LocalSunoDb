name: Imports sidebar version stale 401 v2 proof

on:
  push:
    branches:
      - fix/imports-sidebar-version-stale-401-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Focused tests
        run: |
          python -m pip install pytest
          node --check ls_downloader/static/downloader_state_script.js
          python -m pytest -q tests/test_imports_sidebar_version_stale_401_v2.py
          git diff --check
      - name: Verify exact runtime delta
        run: |
          python - <<'PY'
          import subprocess
          runtime = {
              name for name in subprocess.check_output(
                  ["git", "diff", "--name-only", "934164fcd1c58fb62a61d8033c3439c1914fc0b7...HEAD"],
                  text=True,
              ).splitlines()
              if name and not name.startswith(("tests/", ".github/"))
          }
          expected = {
              "ls_web/templates/secondary_sidebar.html",
              "ls_downloader/templates/downloader.html",
              "ls_downloader/static/downloader_state_script.js",
          }
          assert runtime == expected, (runtime, expected)
          PY
      - name: Build exact correction ZIP
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path

          files = [
              "ls_web/templates/secondary_sidebar.html",
              "ls_downloader/templates/downloader.html",
              "ls_downloader/static/downloader_state_script.js",
          ]
          out = Path("LocalSunoDb_IMPORTS_SIDEBAR_VERSION_STALE_401_V2_FIX.zip")
          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for name in files:
                  archive.write(name, name)
          with zipfile.ZipFile(out, "r") as archive:
              assert archive.namelist() == files
              assert archive.testzip() is None
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: LocalSunoDb-IMPORTS-SIDEBAR-VERSION-STALE-401-V2-FIX
          path: LocalSunoDb_IMPORTS_SIDEBAR_VERSION_STALE_401_V2_FIX.zip
          if-no-files-found: error
          retention-days: 7

  windows-exact-artifact:
    needs: focused-proof
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 934164fcd1c58fb62a61d8033c3439c1914fc0b7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: LocalSunoDb-IMPORTS-SIDEBAR-VERSION-STALE-401-V2-FIX
          path: artifact
      - name: Overlay exact ZIP and verify syntax
        shell: pwsh
        run: |
          Expand-Archive -Path ".\artifact\LocalSunoDb_IMPORTS_SIDEBAR_VERSION_STALE_401_V2_FIX.zip" -DestinationPath "." -Force
          node --check ls_downloader\static\downloader_state_script.js
      - name: Start and verify rendered Imports correction
        shell: pwsh
        run: |
          @'
          import re
          import subprocess
          import sys
          import time
          from urllib.request import urlopen

          out = open("imports-v2-fix-server.log", "w", encoding="utf-8")
          err = open("imports-v2-fix-server.err", "w", encoding="utf-8")
          process = subprocess.Popen(
              [sys.executable, "LocalSunoDb.py", "--ls-restarted"],
              stdout=out,
              stderr=err,
          )
          try:
              for _ in range(160):
                  try:
                      with urlopen("http://127.0.0.1:8765/app-version", timeout=1) as response:
                          if response.status == 200:
                              break
                  except Exception:
                      time.sleep(0.25)
              else:
                  raise AssertionError("LS server did not start")

              with urlopen("http://127.0.0.1:8765/downloader", timeout=5) as response:
                  page = response.read().decode("utf-8", errors="replace")

              match = re.search(
                  r'<span class="ls-sidebar-title-full">LS ([^<]+)</span>',
                  page,
              )
              assert match, "Imports sidebar does not show LS version"
              assert match.group(1).strip(), "Imports sidebar version is empty"
              assert "<h1>Imports</h1>" in page
              assert "Imports <span class=\"muted\">· LS" not in page

              with urlopen(
                  "http://127.0.0.1:8765/ls-static/ls_downloader/static/downloader_state_script.js",
                  timeout=5,
              ) as response:
                  script = response.read().decode("utf-8", errors="replace")
              assert "isHistoricalExpiredSunoTokenStatus(metaStatus.innerText)" in script
              assert 'metaStatus.innerText = "Gatavs."' in script
          finally:
              process.terminate()
              try:
                  process.wait(timeout=10)
              except subprocess.TimeoutExpired:
                  process.kill()
                  process.wait(timeout=5)
              out.close()
              err.close()
          '@ | python -
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: imports-sidebar-version-stale-401-v2-diagnostics
          path: |
            imports-v2-fix-server.log
            imports-v2-fix-server.err
          if-no-files-found: warn
          retention-days: 3
