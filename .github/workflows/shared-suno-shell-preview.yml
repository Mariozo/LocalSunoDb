name: Shared Suno shell preview

on:
  push:
    branches:
      - feat/my-library-playlist-album-ui

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify runtime syntax and focused tests
        run: |
          python -m py_compile ls_library/music_browser.py ls_library/playlists.py
          node --check ls_web/static/persistent_shell.js
          node --check ls_player/static/suno_global_player_script_assets.js
          python -m pip install pytest
          python -m pytest -q tests/test_local_playlists.py
      - name: Build exact runtime overlay
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path
          names = [
              "ls_library/templates/library.html",
              "ls_library/static/suno_page_selected_track_shell_style_assets.css",
              "ls_player/static/suno_global_player_script_assets.js",
              "ls_web/static/persistent_shell.js",
              "ls_web/static/persistent_shell.css",
              "ls_library/music_browser.py",
              "ls_library/playlists.py",
          ]
          out = Path("LocalSunoDb_shared_suno_panel_player_preview.zip")
          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as archive:
              for name in names:
                  archive.write(name, name)
          with zipfile.ZipFile(out, "r") as archive:
              assert archive.namelist() == names
              assert archive.testzip() is None
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: LocalSunoDb-shared-suno-panel-player-preview
          path: LocalSunoDb_shared_suno_panel_player_preview.zip
          if-no-files-found: error
          retention-days: 7
