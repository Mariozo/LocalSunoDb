name: Version v2.02 check

on:
  push:
    branches:
      - task/version-v2.02

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -c "from ls_core.runtime import APP_VERSION, APP_BASED_ON; assert APP_VERSION == 'v2.02'; assert APP_BASED_ON == 'v2.01'"
      - run: python -m pytest -q tests/test_backend_restart.py tests/test_local_playlists.py
      - run: python LocalSunoDb.py --ls-update-probe
