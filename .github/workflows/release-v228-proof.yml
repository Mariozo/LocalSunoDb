name: Release v2.28 proof

on:
  push:
    branches:
      - release/v2.28
    paths:
      - 'LocalSunoDb.py'
      - 'ls_core/runtime.py'
      - 'ls_upgrade/package.py'
      - 'ls_library/playlists.py'
      - 'ls_library/render.py'
      - 'tests/browser/test_direct_library_cutover.py'
      - 'tests/browser/test_playlist_end_to_end.py'
      - '.github/workflows/release-v228-proof.yml'

permissions:
  contents: read

jobs:
  browser-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser dependencies
        run: |
          python -m pip install pytest playwright
          python -m playwright install --with-deps chromium
      - name: Syntax and focused unit checks
        run: |
          python -m py_compile LocalSunoDb.py ls_core/runtime.py ls_upgrade/package.py ls_library/playlists.py ls_library/render.py
          python -m pytest -q tests/test_backend_restart.py tests/test_local_playlists.py
      - name: Seed Direct Library fixture
        run: python tests/browser/seed_direct_library_fixture.py
      - name: Start LocalSunoDb for Direct Library
        run: |
          python LocalSunoDb.py --ls-restarted > release-v228-direct.log 2>&1 &
          echo $! > release-v228-server.pid
          python - <<'PY'
          import time
          from urllib.request import urlopen
          for _ in range(120):
              try:
                  with urlopen("http://127.0.0.1:8765/app-version", timeout=1) as response:
                      if response.status == 200:
                          raise SystemExit(0)
              except Exception:
                  time.sleep(0.25)
          raise SystemExit("LocalSunoDb did not start")
          PY
      - name: Run Direct Library browser proof
        run: python tests/browser/test_direct_library_cutover.py
      - name: Stop Direct Library server
        if: always()
        run: |
          if [ -f release-v228-server.pid ]; then kill "$(cat release-v228-server.pid)" || true; fi
          sleep 1
      - name: Seed Playlist fixture
        run: python tests/browser/seed_select_audio_fixture.py
      - name: Start LocalSunoDb for Playlist
        run: |
          python LocalSunoDb.py --ls-restarted > release-v228-playlist.log 2>&1 &
          echo $! > release-v228-server.pid
          python - <<'PY'
          import time
          from urllib.request import urlopen
          for _ in range(120):
              try:
                  with urlopen("http://127.0.0.1:8765/app-version", timeout=1) as response:
                      if response.status == 200:
                          raise SystemExit(0)
              except Exception:
                  time.sleep(0.25)
          raise SystemExit("LocalSunoDb did not start")
          PY
      - name: Run Playlist browser proof
        run: python tests/browser/test_playlist_end_to_end.py
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-v228-proof-diagnostics
          path: |
            browser-artifacts/
            release-v228-direct.log
            release-v228-playlist.log
          if-no-files-found: warn
          retention-days: 3
      - name: Stop server
        if: always()
        run: |
          if [ -f release-v228-server.pid ]; then kill "$(cat release-v228-server.pid)" || true; fi
